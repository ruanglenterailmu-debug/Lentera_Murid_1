<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lentera_Murid — Belajar Mandiri fase D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F6F2E9;
  --paper-raised:#FFFDF8;
  --ink:#20261F;
  --ink-soft:#565F52;
  --line:#DAD2BE;
  --teal:#28564A;
  --teal-deep:#1B3C34;
  --amber:#B75E1F;
  --amber-soft:#F1DEC7;
  --red:#A3372B;
  --red-soft:#F3DBD6;
  --green:#2F6D4A;
  --green-soft:#DCE9D6;
  --shadow: 0 1px 0 rgba(32,38,31,.06);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Source Sans 3', sans-serif;
  line-height:1.5;
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:
    radial-gradient(circle at 1px 1px, rgba(32,38,31,.05) 1px, transparent 0);
  background-size: 18px 18px;
  pointer-events:none;
  z-index:0;
}
.wrap{position:relative; z-index:1; max-width:980px; margin:0 auto; padding:28px 20px 80px;}

/* ---------- Kop Sekolah (halaman umum: peran, menu, materi, LKM, media) ---------- */
.kop-sekolah{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:4px;
  padding:20px 26px 16px; margin-bottom:18px; text-align:center;
  border-bottom:4px double var(--teal-deep);
}
.ks-emblem{font-size:34px; line-height:1; margin-bottom:6px;}
.ks-pemda{font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-soft); margin:0;}
.ks-nama{font-family:'Fraunces', serif; font-weight:700; font-size:clamp(22px,4.4vw,32px); text-transform:uppercase; letter-spacing:.03em; margin:4px 0; color:var(--teal-deep);}
.ks-sub{font-size:13.5px; color:var(--ink-soft); margin:0;}
.ks-alamat{font-size:13px; color:var(--ink-soft); margin:0 0 4px; line-height:1.45;}

/* ---------- Header / Kop Surat ---------- */
.kop{
  background:var(--paper-raised);
  border:1px solid var(--line);
  border-top:5px solid var(--teal);
  border-radius:4px;
  padding:22px 26px;
  margin-bottom:18px;
}
.kop-top{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;}
.kop-badge{
  display:inline-flex; align-items:center; gap:8px;
  font-family:'JetBrains Mono', monospace;
  font-size:11px; letter-spacing:.04em;
  color:var(--teal-deep);
  background:var(--green-soft);
  border:1px solid #C4D6BC;
  padding:4px 10px; border-radius:100px;
}
.kop-school{font-size:13px; color:var(--ink-soft); margin:0 0 2px;}
.kop-title{
  font-family:'Fraunces', serif;
  font-weight:600;
  font-size:clamp(24px,4vw,32px);
  margin:2px 0 6px;
  color:var(--ink);
}
.kop-sub{color:var(--ink-soft); font-size:14.5px; margin:0;}
.kop-meta{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:10px 20px; margin-top:16px; padding-top:16px; border-top:1px dashed var(--line);
  font-size:13.5px;
}
.kop-meta div span{display:block; color:var(--ink-soft); font-size:11.5px; text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px;}
.kop-meta div strong{font-weight:600;}

/* ---------- Timer + progress bar ---------- */
.statusbar{
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
  background:var(--paper-raised); border:1px solid var(--line); border-radius:4px;
  padding:12px 18px; margin-bottom:18px;
}
.timer{
  font-family:'JetBrains Mono', monospace; font-size:20px; font-weight:500;
  color:var(--teal-deep); min-width:78px;
}
.timer.warn{color:var(--red);}
.statusbar button{
  font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
  border:1px solid var(--teal); background:var(--paper-raised); color:var(--teal-deep);
  padding:7px 13px; border-radius:4px; transition:.15s;
}
.statusbar button:hover{background:var(--teal); color:#fff;}
.statusbar .progress-wrap{flex:1; min-width:180px;}
.progress-label{font-size:12px; color:var(--ink-soft); margin-bottom:4px; display:flex; justify-content:space-between;}
.progress-track{height:8px; background:var(--line); border-radius:100px; overflow:hidden;}
.progress-fill{height:100%; background:var(--teal); border-radius:100px; transition:width .25s;}

/* ---------- Section tabs ---------- */
.tabs{display:flex; gap:8px; margin-bottom:18px; flex-wrap:wrap;}
.tab{
  flex:1; min-width:150px;
  background:var(--paper-raised); border:1px solid var(--line); border-radius:4px;
  padding:12px 14px; cursor:pointer; text-align:left;
}
.tab.active{border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal);}
.tab-name{font-weight:600; font-size:14px; margin-bottom:2px;}
.tab-count{font-size:12px; color:var(--ink-soft);}

/* ---------- Question palette ---------- */
.palette{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:4px;
  padding:16px 18px; margin-bottom:18px;
}
.palette-title{font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:10px;}
.palette-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(34px,1fr)); gap:6px;}
.pill{
  aspect-ratio:1; display:flex; align-items:center; justify-content:center;
  font-family:'JetBrains Mono',monospace; font-size:12px;
  border:1px solid var(--line); border-radius:4px; cursor:pointer; background:#fff;
  color:var(--ink-soft);
}
.pill.answered{background:var(--green-soft); border-color:#B9D2AC; color:var(--teal-deep); font-weight:600;}
.pill.current{outline:2px solid var(--amber); outline-offset:1px;}
.pill.wrong{background:var(--red-soft); border-color:#E2B8AF; color:var(--red);}
.pill.correct{background:var(--green-soft); border-color:#B9D2AC; color:var(--green);}

/* ---------- Passage ---------- */
.passage{
  background:#FBF8F0; border:1px solid var(--line); border-left:4px solid var(--amber);
  border-radius:4px; padding:18px 22px; margin-bottom:16px;
  font-family:'Fraunces', serif; font-size:16px; line-height:1.65; color:#2B3128;
}
.passage p{margin:0 0 12px;}
.passage p:last-child{margin-bottom:0;}
.passage .poem-line{margin:0 0 6px; font-style:italic; color:#3B4136;}
.passage-label{
  font-family:'Source Sans 3',sans-serif; font-style:normal; font-weight:700;
  font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--amber);
  margin-bottom:8px; display:block;
}
.passage table{width:100%; border-collapse:collapse; margin:12px 0; font-family:'Source Sans 3',sans-serif; font-size:14.5px;}
.passage table th, .passage table td{border:1px solid var(--line); padding:8px 10px; text-align:left;}
.passage table th{background:var(--amber-soft); font-weight:600;}

/* ---------- Question card ---------- */
.qcard{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:4px;
  padding:22px 24px; margin-bottom:16px;
}
.qnum-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.qnum{
  font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13px;
  background:var(--teal); color:#fff; padding:3px 9px; border-radius:4px;
}
.qtype-hint{font-size:12px; color:var(--ink-soft); font-style:italic;}
.qstem{font-size:17px; font-weight:500; margin:0 0 16px; color:var(--ink);}
.options{display:flex; flex-direction:column; gap:8px;}
.opt{
  display:flex; align-items:flex-start; gap:12px;
  border:1px solid var(--line); border-radius:4px; padding:11px 14px;
  cursor:pointer; background:#fff; transition:.12s;
}
.opt:hover{border-color:var(--teal);}
.opt.selected{border-color:var(--teal); background:#EEF4EE; box-shadow:inset 0 0 0 1px var(--teal);}
.opt .letter{
  font-family:'JetBrains Mono',monospace; font-weight:600; font-size:13px;
  min-width:22px; height:22px; display:flex; align-items:center; justify-content:center;
  border-radius:50%; border:1px solid var(--line); flex-shrink:0; margin-top:1px;
}
.opt.selected .letter{background:var(--teal); border-color:var(--teal); color:#fff;}
.opt.correct{border-color:var(--green); background:var(--green-soft);}
.opt.correct .letter{background:var(--green); border-color:var(--green); color:#fff;}
.opt.incorrect{border-color:var(--red); background:var(--red-soft);}
.opt.incorrect .letter{background:var(--red); border-color:var(--red); color:#fff;}
.tf-row{display:flex; gap:10px;}
.tf-btn{
  flex:1; text-align:center; border:1px solid var(--line); border-radius:4px;
  padding:14px; cursor:pointer; font-weight:600; background:#fff;
}
.tf-btn.selected{border-color:var(--teal); background:#EEF4EE; box-shadow:inset 0 0 0 1px var(--teal);}
.tf-btn.correct{border-color:var(--green); background:var(--green-soft); color:var(--green);}
.tf-btn.incorrect{border-color:var(--red); background:var(--red-soft); color:var(--red);}
.result-note{margin-top:14px; font-size:13.5px; padding:10px 12px; border-radius:4px;}
.result-note.ok{background:var(--green-soft); color:var(--teal-deep);}
.result-note.bad{background:var(--red-soft); color:#7A281E;}

/* ---------- Nav buttons ---------- */
.navrow{display:flex; justify-content:space-between; gap:10px; margin-top:6px;}
.btn{
  font-family:inherit; font-size:14px; font-weight:600; cursor:pointer;
  border-radius:4px; padding:11px 20px; border:1px solid var(--line); background:#fff; color:var(--ink);
}
.btn.primary{background:var(--teal); border-color:var(--teal); color:#fff;}
.btn.primary:hover{background:var(--teal-deep);}
.btn.ghost{background:transparent;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn.amber{background:var(--amber); border-color:var(--amber); color:#fff;}
.btn.danger{background:#fff; border-color:var(--red); color:var(--red);}
.btn.danger:hover{background:var(--red); color:#fff;}
.btn.danger.solid{background:var(--red); color:#fff;}
.btn.danger.solid:hover{background:#7A281E; border-color:#7A281E;}
.teacher-panel.danger-zone{border-left-color:var(--red);}

/* ---------- Result screen ---------- */
.score-hero{
  background:var(--teal-deep); color:#F6F2E9; border-radius:4px; padding:30px 28px; margin-bottom:20px;
  display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:20px;
}
.score-big{font-family:'Fraunces',serif; font-size:52px; font-weight:600; line-height:1;}
.score-label{font-size:13px; text-transform:uppercase; letter-spacing:.08em; opacity:.75; margin-top:6px;}
.score-breakdown{display:flex; gap:22px; flex-wrap:wrap;}
.score-item{text-align:center;}
.score-item .num{font-family:'JetBrains Mono',monospace; font-size:22px; font-weight:600;}
.score-item .lbl{font-size:11.5px; opacity:.75; text-transform:uppercase; letter-spacing:.05em;}
.review-filter{display:flex; gap:8px; margin-bottom:14px;}
.review-filter button{
  font-family:inherit; font-size:13px; font-weight:600; cursor:pointer;
  border:1px solid var(--line); background:#fff; padding:8px 14px; border-radius:4px;
}
.review-filter button.active{border-color:var(--teal); background:var(--teal); color:#fff;}
.disclaimer{
  font-size:12.5px; color:var(--ink-soft); background:var(--amber-soft); border:1px solid #E4C79E;
  border-radius:4px; padding:10px 14px; margin-bottom:18px;
}
.cover-credit{text-align:center; margin:26px auto 0; max-width:520px; padding:0 12px;}
.cover-credit .cc-line{width:56px; height:3px; background:var(--teal); border-radius:2px; margin:0 auto 12px;}
.cover-credit .cc-top{margin:0; font-size:12.5px; color:var(--ink-soft); letter-spacing:.03em;}
.cover-credit .cc-name{margin:4px 0 2px; font-family:'Fraunces',serif; font-weight:600; font-size:17px; color:var(--ink); letter-spacing:.02em;}
.cover-credit .cc-job{margin:0; font-size:13px; color:var(--ink-soft);}
footer{text-align:center; font-size:12px; color:var(--ink-soft); margin-top:30px;}

/* ---------- Start / Identity screen ---------- */
.start-card{
  background:var(--paper-raised); border:1px solid var(--line); border-radius:4px;
  padding:28px 26px; margin-bottom:18px;
}
.start-card h2{font-family:'Fraunces',serif; font-weight:600; font-size:20px; margin:0 0 4px; color:var(--ink);}
.start-card .start-desc{color:var(--ink-soft); font-size:14px; margin:0 0 22px;}
.form-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:16px; margin-bottom:20px;}
.form-field label{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:6px;}
.form-field input[type="text"], .form-field input[type="number"]{
  width:100%; font-family:inherit; font-size:15px; padding:10px 12px;
  border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--ink);
}
.form-field select{
  width:100%; font-family:inherit; font-size:15px; padding:10px 12px;
  border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--ink); cursor:pointer;
}
.form-field select:focus{outline:none; border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal);}
.form-field.invalid select{border-color:var(--red);}
.kelas-pick{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
.form-field input:focus{outline:none; border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal);}
.form-field .field-error{font-size:12px; color:var(--red); margin-top:4px; display:none;}
.form-field.invalid input{border-color:var(--red);}
.form-field.invalid .field-error{display:block;}
.tool-row{
  display:flex; align-items:flex-start; gap:12px;
  background:#FBF8F0; border:1px solid var(--line); border-left:4px solid var(--teal);
  border-radius:4px; padding:14px 16px; margin-bottom:22px;
}
.tool-row input[type="checkbox"]{margin-top:3px; width:17px; height:17px; accent-color:var(--teal); flex-shrink:0;}
.tool-row .tool-text strong{display:block; font-size:14px; margin-bottom:2px;}
.tool-row .tool-text span{font-size:12.5px; color:var(--ink-soft);}
.id-summary{
  display:flex; flex-wrap:wrap; gap:8px 18px; font-size:13px; color:var(--ink-soft);
  border-top:1px dashed var(--line); padding-top:14px; margin-top:2px;
}
.id-summary strong{color:var(--ink);}
.shuffle-badge{
  display:inline-flex; align-items:center; gap:6px;
  font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.03em;
  color:var(--teal-deep); background:var(--green-soft); border:1px solid #C4D6BC;
  padding:3px 9px; border-radius:100px; margin-left:8px;
}

/* ---------- Menjodohkan ---------- */
.mt-row{display:flex; gap:10px; align-items:center; margin-bottom:8px; flex-wrap:wrap;}
.mt-left{flex:1 1 220px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:#fff;}
.mt-sel{flex:1 1 220px; font:inherit; font-size:14.5px; padding:10px; border:1px solid var(--line); border-radius:8px; background:#fff;}
/* ---------- Editor Soal ---------- */
.qe-area{width:100%; box-sizing:border-box; font:inherit; font-size:14.5px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:#fff; resize:vertical; margin-bottom:8px;}
.qe-area:focus,.qe-opt input:focus{outline:none; border-color:var(--teal); box-shadow:inset 0 0 0 1px var(--teal);}
.qe-lbl{display:block; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin:6px 0 4px;}
.qe-opt{display:flex; gap:8px; align-items:center; margin-bottom:6px;}
.qe-opt input{flex:1; font:inherit; font-size:14.5px; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:#fff;}
.qe-key{width:34px; height:34px; flex:none; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:8px; cursor:pointer; font-weight:600; background:#fff;}
.qe-key.on{background:var(--teal); border-color:var(--teal); color:#fff;}
.qe-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
.qe-del{border:0; background:none; color:var(--red); cursor:pointer; font-size:13px;}
/* ---------- Save status + teacher recap panel ---------- */
.save-status{
  font-size:13px; padding:10px 14px; border-radius:4px; margin-bottom:18px;
  border:1px solid var(--line); background:var(--paper-raised);
}
.save-status.saving{color:var(--ink-soft);}
.save-status.saved{background:var(--green-soft); border-color:#B9D2AC; color:var(--teal-deep);}
.save-status.error{background:var(--red-soft); border-color:#E2B8AF; color:#7A281E;}
.teacher-panel{
  background:var(--paper-raised); border:1px solid var(--line); border-left:4px solid var(--amber);
  border-radius:4px; padding:18px 20px; margin-bottom:20px;
}
.teacher-panel h3{font-family:'Fraunces',serif; font-weight:600; font-size:16px; margin:0 0 4px; color:var(--ink);}
.teacher-panel .tp-desc{font-size:13px; color:var(--ink-soft); margin:0 0 14px;}
.tp-lock-row{display:flex; gap:10px; flex-wrap:wrap; align-items:center;}
.tp-lock-row input[type="password"]{
  font-family:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--line);
  border-radius:4px; background:#fff; min-width:160px;
}
.tp-error{font-size:12.5px; color:var(--red); margin-top:8px; display:none;}
.tp-error.show{display:block;}
.recap-actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:4px;}
.recap-status{font-size:13px; color:var(--ink-soft); margin-top:10px;}
.recap-status.error{color:var(--red);}
.exam-lock, .exam-lock *{-webkit-user-select:none; user-select:none;}
.exam-lock input, .exam-lock textarea{-webkit-user-select:text; user-select:text;}
.short-in,.essay-in{width:100%; font:inherit; font-size:16px; padding:12px 14px; border:1.5px solid var(--line); border-radius:4px; background:#fff; color:var(--ink); line-height:1.5;}
.short-in:focus,.essay-in:focus{outline:3px solid rgba(184,134,43,.35); border-color:var(--amber);}
.essay-in{min-height:190px; resize:vertical;}
.essay-meta{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; font-size:12.5px; color:var(--ink-soft); margin-top:6px;}
.ans-note{font-size:12.5px; color:var(--ink-soft); margin-top:8px;}
.grade-panel{border:2px solid var(--amber); border-radius:6px; background:#FFFDF8; padding:16px 18px; margin:0 0 16px;}
.grade-panel h4{font-family:'Fraunces',serif; margin:0 0 4px; font-size:17px;}
.grade-q{border-top:1px dashed var(--line); padding:12px 0;}
.grade-q .gq-stem{font-weight:600; font-size:14.5px; margin-bottom:6px; white-space:pre-wrap;}
.grade-q .gq-ans{background:#fff; border:1px solid var(--line); border-radius:4px; padding:10px 12px; white-space:pre-wrap; font-size:14px; min-height:44px;}
.grade-q .gq-key{background:#F1F6EC; border-left:4px solid var(--teal); padding:8px 12px; margin-top:6px; font-size:13px; white-space:pre-wrap;}
.grade-q .gq-score{display:flex; align-items:center; gap:8px; margin-top:8px; font-size:13.5px;}
.grade-q .gq-score input{width:84px; padding:7px 9px; border:1px solid var(--line); border-radius:4px; font-family:'JetBrains Mono',monospace;}
.lock-overlay{position:fixed; inset:0; z-index:100000; background:rgba(32,38,31,.88); display:flex; align-items:center; justify-content:center; padding:20px;}
.lock-box{background:#FFFDF8; border-radius:6px; border-top:5px solid var(--red); max-width:440px; width:100%; padding:26px 24px; text-align:center;}
.lock-box h3{font-family:'Fraunces',serif; margin:0 0 8px; font-size:20px; color:var(--red);}
.lock-box p{margin:0 0 16px; font-size:14.5px; color:var(--ink);}
.lock-count{font-family:'JetBrains Mono',monospace; font-weight:600; font-size:15px; margin-bottom:16px;}
.start-block{display:none; background:var(--red-soft); border:1px solid #E2B8AF; color:#7A281E; border-radius:4px; padding:12px 14px; font-size:13.5px; margin-bottom:16px;}
.rules-box{background:#FBF8F0; border:1px solid var(--line); border-left:4px solid var(--red); border-radius:4px; padding:12px 16px; font-size:13.5px; margin-bottom:18px;}
.rules-box ul{margin:6px 0 0; padding-left:20px;}
.kls-pending{margin-top:14px; background:#fff; border:1px solid var(--line); border-left:4px solid var(--amber); border-radius:4px; padding:12px 14px; font-size:13.5px;}
.kls-pending .row{display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap; padding:6px 0; border-top:1px dashed var(--line);}
/* ---------- Daftar Nilai (model dokumen cetak) ---------- */
.dn-paper{background:#fff; border:1px solid var(--line); border-radius:4px; padding:22px 26px; margin-bottom:18px; font-family:'Times New Roman',Times,serif; color:#000; overflow-x:auto;}
.dn-kop{display:flex; align-items:center; gap:14px;}
.dn-logo{width:84px; height:84px; flex:none; display:flex; align-items:center; justify-content:center;}
.dn-logo img{max-width:100%; max-height:100%;}
.dn-kop-text{flex:1; text-align:center; font-weight:700; font-size:15px; line-height:1.35; margin-right:84px;}
.dn-kop-text .dn-n{font-size:19px; text-transform:uppercase;}
.dn-kop-text .dn-r{font-weight:400; font-size:13px;}
.dn-rule{border-top:3px solid #000; border-bottom:1px solid #000; height:3px; margin:8px 0 12px;}
.dn-title{text-align:center; font-weight:700; font-size:15px; line-height:1.45; margin-bottom:12px;}
.dn-wali{font-weight:700; margin:0 0 8px; font-size:14px;}
.dn-table{width:100%; border-collapse:collapse; font-size:13px;}
.dn-table th,.dn-table td{border:1px solid #000; padding:4px 6px;}
.dn-table th{background:#C0C0C0; text-align:center; font-weight:700;}
.dn-table td.c{text-align:center;}
.dn-table tbody tr{height:30px;}
.dn-in{width:100%; border:0; background:transparent; font:inherit; text-align:center; padding:2px; min-width:46px;}
.dn-in:focus{outline:2px solid var(--amber); background:#FFF9EC;}
.dn-del{border:0; background:none; color:var(--red); cursor:pointer; font-size:12px; padding:0 0 0 6px;}
.dn-chk{display:inline-flex; gap:6px; align-items:center; font-size:13px; margin:0 14px 6px 0; cursor:pointer;}
.dn-chk input{accent-color:var(--teal); width:16px; height:16px;}
@media print{
  body::before{display:none;}
  body.dn-print .wrap{padding:0; max-width:none;}
  body.dn-print #app > *:not(.dn-paper){display:none !important;}
  body.dn-print .dn-paper{border:0; padding:0; margin:0; overflow:visible;}
  body.dn-print .dn-in{border:0 !important; outline:0 !important; background:transparent !important;}
  body.dn-print .no-print{display:none !important;}
}
.menu-grid{display:grid; grid-template-columns:repeat(5,1fr); gap:14px; margin:6px 0 18px;}
@media (max-width:900px){ .menu-grid{grid-template-columns:repeat(2,1fr);} }
.menu-tile{
  border:none; cursor:pointer; color:#fff; border-radius:14px; padding:22px 10px 18px; min-height:132px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px;
  font-family:'Source Sans 3',sans-serif; box-shadow:0 3px 0 rgba(0,0,0,.18); transition:transform .12s;
}
.menu-tile:hover{transform:translateY(-2px);}
.menu-tile:active{transform:translateY(1px);}

.mi-edit{background:#fff; border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:10px; display:grid; gap:8px;}
.mi-edit input,.mi-edit textarea{width:100%; font-family:inherit; font-size:14px; padding:8px 10px; border:1px solid var(--line); border-radius:4px; background:#fff; color:var(--ink);}
.mi-edit textarea{min-height:54px; resize:vertical;}
details.mi-sec{border:1px solid var(--line); border-radius:6px; background:var(--paper-raised); margin-bottom:10px;}

details.mi-sec .mi-body{padding:0 14px 14px;}
.kls-bar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin:10px 0 4px;}
.kls-bar select{font-family:inherit; font-size:14px; padding:9px 12px; border:1px solid var(--line); border-radius:4px; background:#fff;}
.kls-bar label.chk{display:flex; gap:6px; align-items:center; font-size:13px; color:var(--ink-soft); cursor:pointer;}
.kls-bar label.chk input{accent-color:var(--teal); width:16px; height:16px;}

.kls-card{background:#fff; border:1px solid var(--line); border-radius:4px; padding:12px 14px;}
.kls-card.active{border-color:var(--teal); box-shadow:0 0 0 1px var(--teal);}
.kls-card .kn{font-family:'Fraunces',serif; font-weight:600; font-size:17px; cursor:pointer;}
.kls-card .km{font-size:12.5px; color:var(--ink-soft); margin:2px 0 8px;}
.kls-card .btn{padding:6px 10px; font-size:12.5px; width:100%;}
.kls-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:4px; background:#fff; margin-top:10px;}
.kls-table{width:100%; border-collapse:collapse; font-size:13.5px; min-width:560px;}
.kls-table th,.kls-table td{border-bottom:1px solid var(--line); padding:7px 10px; text-align:left; white-space:nowrap;}
.kls-table th{background:var(--amber-soft); font-weight:600; position:sticky; top:0;}
.kls-table td.num,.kls-table th.num{text-align:right; font-family:'JetBrains Mono',monospace;}
.kls-table tr.grp td{background:var(--paper); font-weight:600; font-family:'Fraunces',serif;}
.kls-stats{font-size:13px; color:var(--ink-soft); margin-top:8px;}
.kls-table td.nl-low{color:var(--red); font-weight:600;}
.kls-table td.fin{background:var(--green-soft); font-weight:700;}
.kls-table tr.avg td{background:var(--amber-soft); font-weight:600;}
.my-result-row{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line);}
@media (max-width:640px){

  .qcard{padding:16px;}

}

async function poolMap(items, limit, fn){
  const out = new Array(items.length); let next = 0;
  const workers = Array.from({length: Math.min(limit, items.length)}, async () => {
    while(true){ const i = next++; if(i >= items.length) break; out[i] = await fn(items[i], i); }

  await Promise.all(workers);
  return out;
}

    if(window.crypto && crypto.subtle){
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }
  }catch(e){}
  let h = 5381; for(let i=0;i<txt.length;i++){ h = ((h << 5) + h + txt.charCodeAt(i)) | 0; }
  return 'x' + (h >>> 0).toString(16);
}

/* Tulis ke penyimpanan bersama dengan percobaan ulang (error server sesaat / batas laju) */
async function storageSet(key, value){
  let lastErr = null;
  for(let i=0;i<3;i++){
    try{ const r = await window.storage.set(key, value, true); if(r) return r; lastErr = new Error('Penyimpanan tidak merespons'); }
    catch(e){ lastErr = e; }
    if(i < 2) await new Promise(res => setTimeout(res, 500*(i+1) + Math.random()*600));
  }
  throw lastErr || new Error('Gagal menyimpan');
}
function reportSaveFail(what, key, value, e){

  const kb = Math.round(String(value).length/1024);

function escapeHtml(s){

function formatTime(sec){

function shuffleArray(arr){
  const a = [...arr];
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shuffleAllOptions(){

  ALL_Q.forEach(q => {

function generateToken(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let t = '';
  for(let i=0;i<6;i++) t += chars[Math.floor(Math.random()*chars.length)];
  return t;
}
function sectionQuestions(id){ return ALL_Q.filter(q => q.sectionId === id); }
function globalIdx(num){ return ALL_Q.findIndex(q=>q.num===num); }
function isAnswered(num){
  const a = state.answers[num];
  if(a === undefined || a === null) return false;
  if(Array.isArray(a)) return a.some(x => x !== '');
  if(typeof a === 'string') return a.trim() !== '';
  return a !== '';
}
function scoreSection(sec){
  let correct = 0, pts = 0, max = 0;
  sec.questions.forEach(q => {
    const a = state.answers[q.num];
    const mx = qMax(q, sec.type); max += mx;
    const c0 = correct;
    if(sec.type === 'short'){
      if(shortCorrect(q, a)) correct++;
    } else if(sec.type === 'single'){
      const qq = Q_BY_NUM[q.num] || q;   // salinan siswa (opsi bisa diacak per siswa)
      const correctLabel = qq.options.find(o=>o.correct).label;
      if(a === correctLabel) correct++;
    } else if(sec.type === 'multi'){
      const qq = Q_BY_NUM[q.num] || q;
      const correctLabels = qq.options.filter(o=>o.correct).map(o=>o.label).sort().join(',');
      const chosen = Array.isArray(a) ? [...a].sort().join(',') : '';
      if(chosen === correctLabels) correct++;
    } else if(sec.type === 'matching'){
      if(Array.isArray(a) && q.pairs && q.pairs.length && q.pairs.every((p,i) => a[i] === p.right)) correct++;
    } else if(sec.type === 'truefalse'){
      const correctVal = q.correct ? 'Benar' : 'Salah';
      if(a === correctVal) correct++;
    }
    if(correct > c0) pts += mx;
  });
  return {correct, total: sec.questions.length, pts, max};
}
/* Ringkasan skor: soal otomatis (pilihan, benar-salah, menjodohkan, isian) vs uraian (dinilai guru) */
function scoreSummary(){
  const perSection = DATA.sections.map(sec => ({sec, ...scoreSection(sec)}));
  const auto = perSection.filter(s => s.sec.type !== 'essay'), essay = perSection.filter(s => s.sec.type === 'essay');
  const autoPts = auto.reduce((a, s) => a + s.pts, 0), autoMax = auto.reduce((a, s) => a + s.max, 0);
  const essayMax = essay.reduce((a, s) => a + s.max, 0), essayN = essay.reduce((a, s) => a + s.total, 0);
  const autoCorrect = auto.reduce((a, s) => a + s.correct, 0), autoN = auto.reduce((a, s) => a + s.total, 0);
  const maxPts = autoMax + essayMax;
  return { perSection, autoPts, autoMax, essayMax, essayN, autoCorrect, autoN, maxPts,
    pct: maxPts ? Math.round(autoPts / maxPts * 100) : 0, autoPct: autoMax ? Math.round(autoPts / autoMax * 100) : 0 };
}
/* Daftar jawaban ketik (isian & uraian) yang disimpan bersama hasil agar guru dapat menilai */
function collectTeks(){
  const out = [];
  DATA.sections.forEach(sec => {
    if(sec.type !== 'short' && sec.type !== 'essay') return;
    sec.questions.forEach(q => {
      const a = String(state.answers[q.num] == null ? '' : state.answers[q.num]);
      const o = { n: q.num, t: sec.type, sec: sec.id, a, m: qMax(q, sec.type), s: String(q.stem || '').slice(0, 140) };
      if(sec.type === 'short') o.ok = shortCorrect(q, a);
      out.push(o);
    });
  });
  return out;
}
function effectivePassage(q){
  if(q.passage && q.passage.trim()) return q.passage;
  const qs = sectionQuestions(q.sectionId);
  const idx = qs.findIndex(x => x.num === q.num);
  for(let i=idx-1;i>=0;i--){
    if(qs[i].passage && qs[i].passage.trim()) return qs[i].passage;
  }
  return '';
}
function renderPassageBlock(passageText){
  if(!passageText) return '';
  let out = '';
  const tableMatch = passageText.match(/\[TABLE\]([\s\S]*?)\[\/TABLE\]/);
  let before = passageText, tableHtml = '', after = '';
  if(tableMatch){
    before = passageText.slice(0, tableMatch.index);
    after = passageText.slice(tableMatch.index + tableMatch[0].length);
    const rows = tableMatch[1].trim().split('\n').map(r => r.split('|'));
    const header = rows[0];
    const body = rows.slice(1);
    tableHtml = '<table><thead><tr>' + header.map(h=>`<th>${escapeHtml(h)}</th>`).join('') + '</tr></thead><tbody>' +
      body.map(r => '<tr>' + r.map(c=>`<td>${escapeHtml(c)}</td>`).join('') + '</tr>').join('') +
      '</tbody></table>';
  }
  const isPoem = /^Puisi:/.test(passageText.trim());
  function paragraphsHtml(txt){
    return txt.split(/\n\n+/).filter(p=>p.trim()).map(p => {
      if(isPoem && !/^Puisi:/.test(p)) return `<p class="poem-line">${escapeHtml(p)}</p>`;
      return `<p>${escapeHtml(p)}</p>`;
    }).join('');
  }
  out = paragraphsHtml(before) + tableHtml + paragraphsHtml(after);
  return `<div class="passage"><span class="passage-label">Teks bacaan</span>${out}</div>`;
}
function triggerDownload(csvContent, filename){
  const blob = new Blob([csvContent], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function csvEscape(v){
  const s = String(v === undefined || v === null ? '' : v);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

const ESSAY_DEFAULT_PTS = 10, SHORT_MAX_LEN = 120, ESSAY_MAX_LEN = 2000;
function qMax(q, type){
  const p = Number(q && q.pts);
  if(type === 'essay') return p > 0 ? p : ESSAY_DEFAULT_PTS;
  if(type === 'short') return p > 0 ? p : 1;
  return 1;
}
function normAns(s){
  return String(s == null ? '' : s).normalize('NFKC').toLowerCase()
    .replace(/(\d)\s*,\s*(\d)/g, '$1.$2').replace(/[‘’“”"'`]/g, '')
    .replace(/\s+/g, ' ').trim().replace(/[.,;:!?\s]+$/, '').replace(/^[.,;:!?\s]+/, '');
}
function shortCorrect(q, a){
  const x = normAns(a); if(!x) return false;
  return (q.answers || []).some(k => { const y = normAns(k); return y && y === x; });
}
function fmtPts(n){ return String(Math.round(Number(n) * 100) / 100).replace('.', ','); }
function newSectionOfType(type){
  const t = SEC_TYPES[type];
  const id = 'ABCDEFGH'.split('').find(c => !DATA.sections.some(x => x.id === c));
  if(!t || !id) return null;
  return { id, label: id + '. ' + t.name, instruction: t.instr, type, questions: [] };
}

async function clearBankQuestions(secId){
  if(secId == null) DATA.sections = [];
  else DATA.sections = DATA.sections.filter(s => s.id !== secId);
  renumberBank();
  await saveBank(DATA);
  if(state.session && state.session.status === 'open') await saveSession({...state.session, status: 'closed'});
  state.editingQuestions = false; state.editingKeys = false; state.editBackup = null;
  state.uploadPreview = null; state.bankPanel = null;
  state.uploadError = secId == null
    ? '&#9989; Seluruh soal berhasil dihapus. Bank soal kini kosong.'
    : '&#9989; Bagian soal berhasil dihapus.';
  render();
}
function addQuestionOfType(type){
  if(!state.editingQuestions){ state.editBackup = JSON.stringify(DATA); state.editingQuestions = true; }
  let sec = DATA.sections.find(s => s.type === type);
  if(!sec){
    sec = newSectionOfType(type);
    if(!sec){ alert('Jumlah bagian soal sudah maksimal.'); return; }
    DATA.sections.push(sec);
  }
  const q = qeNewQ(sec);
  sec.questions.push(q);
  renumberBank();
  state.bankPanel = null;
  render();
  setTimeout(() => {
    const el = document.querySelector(`[data-qf="${q.num}|${type === 'truefalse' ? 'statement' : 'stem'}"]`);
    if(el){ el.scrollIntoView({behavior:'smooth', block:'center'}); el.focus(); }
  }, 60);
}
/* ---- Editor Soal: ubah teks, opsi, kunci; tambah / hapus soal ---- */
function qeNewQ(sec){
  const q = {num: 0, passage: ''};
  if(sec.type === 'truefalse'){ q.statement = ''; q.correct = true; }
  else if(sec.type === 'matching'){ q.stem = 'Pasangkan setiap pernyataan dengan jawaban yang tepat.'; q.pairs = [{left:'',right:''},{left:'',right:''},{left:'',right:''}]; }
  else if(sec.type === 'short'){ q.stem = ''; q.answers = ['']; q.pts = 1; }
  else if(sec.type === 'essay'){ q.stem = ''; q.key = ''; q.pts = ESSAY_DEFAULT_PTS; }
  else { q.stem = ''; q.options = ['A','B','C','D'].map((l,i) => ({label: l, text: '', correct: sec.type === 'multi' ? i < 2 : i === 0})); }
  return q;
}
function renumberBank(){ let n = 0; DATA.sections.forEach(sec => sec.questions.forEach(q => { q.num = ++n; })); rebuildBankIndex(); }
function qeCancel(){
  if(state.editBackup){ DATA = JSON.parse(state.editBackup); rebuildBankIndex(); }

function attachQuestionEditorHandlers(){
  if(!state.editingQuestions) return;
  document.querySelectorAll('[data-qf]').forEach(el => el.oninput = () => {
    const [num, field] = el.dataset.qf.split('|'); const f = findBankQuestion(parseInt(num,10));

  });
  document.querySelectorAll('[data-qo]').forEach(el => el.oninput = () => {

  });
  document.querySelectorAll('[data-qans]').forEach(el => el.oninput = () => {
    const f = findBankQuestion(parseInt(el.dataset.qans,10)); if(f) f.q.answers = el.value.split('\n');
  });
  document.querySelectorAll('[data-qkey]').forEach(el => el.oninput = () => {
    const f = findBankQuestion(parseInt(el.dataset.qkey,10)); if(f) f.q.key = el.value;
  });
  document.querySelectorAll('[data-qpts]').forEach(el => el.oninput = () => {
    const f = findBankQuestion(parseInt(el.dataset.qpts,10)); if(f) f.q.pts = parseFloat(String(el.value).replace(',', '.'));
  });
  document.querySelectorAll('[data-qc]').forEach(el => el.onclick = () => {
    const f = findBankQuestion(parseInt(el.dataset.qc,10)); if(!f) return;
    const {q, sec} = f, label = el.dataset.label;
    if(sec.type === 'single') q.options.forEach(o => o.correct = (o.label === label));
    else { const o = q.options.find(x => x.label === label); o.correct = !o.correct; }
    render();
  });
  document.querySelectorAll('[data-qtf]').forEach(el => el.onclick = () => {
    const f = findBankQuestion(parseInt(el.dataset.qtf,10)); if(f){ f.q.correct = (el.dataset.val === 'true'); render(); }
  });
  document.querySelectorAll('[data-qdel]').forEach(el => el.onclick = () => {
    const num = parseInt(el.dataset.qdel,10), f = findBankQuestion(num); if(!f) return;
    if(f.sec.questions.length <= 1){ alert('Setiap bagian harus memiliki minimal 1 soal.'); return; }
    if(!confirm('Hapus soal No. ' + num + '? Nomor soal sesudahnya akan bergeser, dan rekap nilai lama tidak ikut berubah.')) return;
    const flat = []; DATA.sections.forEach(sc => sc.questions.forEach(q => flat.push(q)));
    const i = flat.indexOf(f.q), next = flat[i+1];
    if(f.q.passage && f.q.passage.trim() && next && !(next.passage && next.passage.trim())) next.passage = f.q.passage;
    f.sec.questions.splice(f.sec.questions.indexOf(f.q), 1);
    renumberBank(); render();
  });
  document.querySelectorAll('[data-qadd]').forEach(el => el.onclick = () => {
    const sec = DATA.sections.find(x => x.id === el.dataset.qadd); if(!sec) return;
    sec.questions.push(qeNewQ(sec)); renumberBank(); render();
  });
  const pairOf = (v) => { const [n,i] = v.split('|'); const f = findBankQuestion(parseInt(n,10)); return f ? {q:f.q, i:parseInt(i,10)} : null; };
  document.querySelectorAll('[data-qpl]').forEach(el => el.oninput = () => { const r = pairOf(el.dataset.qpl); if(r) r.q.pairs[r.i].left = el.value; });
  document.querySelectorAll('[data-qpr]').forEach(el => el.oninput = () => { const r = pairOf(el.dataset.qpr); if(r) r.q.pairs[r.i].right = el.value; });
  document.querySelectorAll('[data-qpdel]').forEach(el => el.onclick = () => {
    const r = pairOf(el.dataset.qpdel); if(!r) return;
    if(r.q.pairs.length <= 2){ alert('Minimal 2 pasangan.'); return; }
    r.q.pairs.splice(r.i,1); render();
  });
  document.querySelectorAll('[data-qpadd]').forEach(el => el.onclick = () => {
    const f = findBankQuestion(parseInt(el.dataset.qpadd,10)); if(f){ f.q.pairs.push({left:'',right:''}); render(); }
  });
  document.querySelectorAll('[data-qsec]').forEach(el => el.onclick = () => {
    const sec = newSectionOfType(el.dataset.qsec); if(!sec) return;
    sec.questions.push(qeNewQ(sec)); DATA.sections.push(sec); renumberBank(); render();
  });
  document.querySelectorAll('[data-qe-cancel]').forEach(el => el.onclick = () => {
    if(confirm('Batalkan semua perubahan soal yang belum disimpan?')) qeCancel();
  });
  document.querySelectorAll('[data-qe-save]').forEach(el => el.onclick = async () => {
    const problems = [];
    DATA.sections.forEach(sec => sec.questions.forEach(q => {
      const t = sec.type === 'truefalse' ? q.statement : q.stem;
      if(!t || !t.trim()) problems.push('No. ' + q.num + ': teks soal masih kosong');
      if(sec.type === 'matching'){
        if(!q.pairs || q.pairs.length < 2 || q.pairs.some(pr => !pr.left.trim() || !pr.right.trim())) problems.push('No. ' + q.num + ': pasangan menjodohkan belum lengkap (min. 2, kiri & kanan terisi)');
      } else if(sec.type === 'short'){
        q.answers = (q.answers || []).map(x => String(x).trim()).filter(Boolean);
        if(!q.answers.length) problems.push('No. ' + q.num + ': kunci jawaban isian belum diisi');
        if(!(Number(q.pts) > 0)) q.pts = 1;
      } else if(sec.type === 'essay'){
        q.key = String(q.key || '').trim();
        if(!(Number(q.pts) > 0)) problems.push('No. ' + q.num + ': skor maksimal uraian harus lebih dari 0');
      } else if(sec.type !== 'truefalse'){
        if(q.options.some(o => !o.text.trim())) problems.push('No. ' + q.num + ': ada opsi yang kosong');
        const need = sec.type === 'multi' ? 2 : 1;
        if(q.options.filter(o => o.correct).length !== need) problems.push('No. ' + q.num + ': kunci harus tepat ' + need);
      }
    }));
    if(problems.length){ alert('Perbaiki dulu:\n' + problems.slice(0,10).join('\n')); return; }
    await saveBank(DATA);
    state.editingQuestions = false; state.editBackup = null; render();
    alert('Perubahan soal berhasil disimpan.');
  });
}

/* ---- Jadwal ujian: tanggal, bulan, tahun, jam mulai & selesai ---- */
function isoToParts(iso){
  const x = iso ? new Date(iso) : null;
  if(!x || isNaN(x)) return { d:'', t:'' };
  const p = n => String(n).padStart(2,'0');
  return { d: `${x.getFullYear()}-${p(x.getMonth()+1)}-${p(x.getDate())}`, t: `${p(x.getHours())}:${p(x.getMinutes())}` };
}
function partsToIso(d,t){
  if(!d) return '';
  const x = new Date(`${d}T${t||'00:00'}`);
  return isNaN(x) ? '' : x.toISOString();
}
function fmtJadwal(iso){
  return iso ? new Date(iso).toLocaleString('id-ID',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '-';
}
function checkJadwal(sess){
  if(!sess) return '';
  const now = Date.now();
  if(sess.startAt && now < new Date(sess.startAt).getTime()) return 'Ujian belum dimulai. Jadwal mulai: ' + fmtJadwal(sess.startAt) + '.';
  if(sess.endAt && now > new Date(sess.endAt).getTime()) return 'Waktu ujian sudah berakhir pada ' + fmtJadwal(sess.endAt) + '.';
  return '';
}
function readJadwal(){
  const startAt = partsToIso(document.getElementById('input-tgl-mulai').value, document.getElementById('input-jam-mulai').value);
  const endAt = partsToIso(document.getElementById('input-tgl-selesai').value, document.getElementById('input-jam-selesai').value);
  let err = '';
  if(startAt && endAt && new Date(endAt) <= new Date(startAt)) err = 'Waktu selesai harus setelah waktu mulai.';
  return { startAt, endAt, err };
}

/* ---- Handlers dashboard guru ---- */
function attachGuruDashHandlers(){
  document.querySelectorAll('.tab').forEach(el => {
    el.onclick = () => { state.guruTab = el.dataset.gt; state.menuDraft = null; state.uploadPreview = null; state.uploadError=''; render(); };
  });
  document.getElementById('btn-back-role').onclick = () => { state.view = 'role'; render(); };
  if(state.guruTab === 'bank') attachBankTabHandlers();
  const selEx = document.getElementById('sel-exam-type');
  if(selEx) selEx.onchange = e => { const v = e.target.value, ni = examInfo(v), ci = examInfo(); switchExamType(ni.iktp ? iktpId(ni.tpKey, ci.iktp || 1) : v); };
  const selIk = document.getElementById('sel-exam-iktp'); if(selIk) selIk.onchange = e => switchExamType(e.target.value);
  if(state.guruTab === 'sesi' && !isPractice()) attachSesiTabHandlers();
  if(state.guruTab === 'rekap' && !isPractice()) attachRekapTabHandlers();
  if(state.guruTab === 'menu') attachMenuTabHandlers();
  if(state.guruTab === 'tugas') attachTugasHandlers();
  if(state.guruTab === 'nilai') attachNilaiHandlers();
  if(state.guruTab === 'guru' && state.isAdmin) attachKelolaGuruHandlers();
}

function attachBankTabHandlers(){
  const shuffleBtn = document.getElementById('btn-shuffle-bank');
  if(shuffleBtn) shuffleBtn.onclick = async () => {
    if(!confirm('Acak ulang urutan opsi A/B/C/D untuk seluruh soal pilihan ganda? Berlaku untuk semua siswa mulai sekarang.')) return;
    await guruShuffleBankNow();
    render();
  };
  const toggleEdit = document.getElementById('btn-toggle-edit-keys');
  if(toggleEdit) toggleEdit.onclick = () => { state.editingKeys = !state.editingKeys; render(); };
  const toggleQ = document.getElementById('btn-toggle-edit-q');
  if(toggleQ) toggleQ.onclick = () => {
    if(state.editingQuestions){ if(!confirm('Tutup editor? Perubahan yang belum disimpan akan dibatalkan.')) return; qeCancel(); return; }
    state.editBackup = JSON.stringify(DATA); state.editingQuestions = true; render();
  };
  const toggleAdd = document.getElementById('btn-toggle-add');
  if(toggleAdd) toggleAdd.onclick = () => { state.bankPanel = state.bankPanel === 'add' ? null : 'add'; render(); };
  const toggleClear = document.getElementById('btn-toggle-clear');
  if(toggleClear) toggleClear.onclick = () => { state.bankPanel = state.bankPanel === 'clear' ? null : 'clear'; render(); };
  document.querySelectorAll('[data-addtype]').forEach(el => el.onclick = () => addQuestionOfType(el.dataset.addtype));
  document.querySelectorAll('[data-clr-sec]').forEach(el => el.onclick = async () => {
    const sec = DATA.sections.find(x => x.id === el.dataset.clrSec); if(!sec) return;
    let msg = 'Hapus ' + sec.label + ' (' + sec.questions.length + ' soal)? Nomor soal sesudahnya akan bergeser dan sesi/token yang sedang dibuka akan ditutup.';
    if(state.editingQuestions) msg += '\n\nPerubahan di Editor Soal yang belum disimpan juga akan ikut tersimpan/hilang.';
    if(!confirm(msg)) return;
    await clearBankQuestions(sec.id);
  });
  const clearAll = document.getElementById('btn-clear-all');
  if(clearAll) clearAll.onclick = async () => {
    const ans = prompt('Ini akan menghapus SEMUA ' + BANK_Q.length + ' soal pada bank soal aktif dan tidak bisa dibatalkan.\n\nKetik HAPUS untuk melanjutkan:');
    if(ans === null) return;
    if(ans.trim().toUpperCase() !== 'HAPUS'){ alert('Dibatalkan: kata konfirmasi tidak sesuai.'); return; }
    await clearBankQuestions(null);
  };
  attachQuestionEditorHandlers();

  if(state.editingKeys){
    document.querySelectorAll('[data-edit-opt]').forEach(el => {
      el.onclick = () => {
        const num = parseInt(el.dataset.editOpt, 10);
        const label = el.dataset.label;
        const found = findBankQuestion(num);
        if(!found) return;
        const {q, sec} = found;
        if(sec.type === 'single'){
          q.options.forEach(o => o.correct = (o.label === label));
        } else {
          const opt = q.options.find(o => o.label === label);
          opt.correct = !opt.correct;
        }
        render();
      };
    });
    document.querySelectorAll('[data-edit-tf]').forEach(el => {
      el.onclick = () => {
        const num = parseInt(el.dataset.editTf, 10);
        const found = findBankQuestion(num);
        if(!found) return;
        found.q.correct = (el.dataset.val === 'true');
        render();
      };
    });
    const saveKeysBtn = document.getElementById('btn-save-keys');
    if(saveKeysBtn) saveKeysBtn.onclick = async () => {
      const problems = [];
      DATA.sections.forEach(sec => {
        if(sec.type === 'single' || sec.type === 'multi'){
          const need = sec.type === 'multi' ? 2 : 1;
          sec.questions.forEach(q => {
            const c = q.options.filter(o => o.correct).length;
            if(c !== need) problems.push(q.num);
          });
        }
      });
      if(problems.length){
        alert('Periksa kembali soal nomor: ' + problems.join(', ') + '. Pilihan Ganda biasa harus tepat 1 kunci benar, Pilihan Ganda Kompleks harus tepat 2 kunci benar.');
        return;
      }
      await saveBank(DATA);
      state.editingKeys = false;
      render();
    };
  }

  const saveMetaBtn = document.getElementById('btn-save-meta');
  if(saveMetaBtn) saveMetaBtn.onclick = async () => {
    DATA.meta.title = document.getElementById('meta-title').value;
    DATA.meta.subject = document.getElementById('meta-subject').value;
    DATA.meta.grade = document.getElementById('meta-grade').value;
    DATA.meta.duration = document.getElementById('meta-duration').value;
    DATA.meta.year = document.getElementById('meta-year').value;
    DATA.meta.curriculum = document.getElementById('meta-curriculum').value.trim();
    await saveBank(DATA);
    render();
  };

  const parseBtn = document.getElementById('btn-parse-docx');
  if(parseBtn) parseBtn.onclick = async () => {
    const inp = document.getElementById('input-docx');
    if(!inp.files || !inp.files[0]){ state.uploadError = 'Pilih file .docx atau .pdf terlebih dahulu.'; render(); return; }
    const file = inp.files[0];
    const fname = (file.name || '').toLowerCase();
    const isPdf = fname.endsWith('.pdf');
    const isDocx = fname.endsWith('.docx');
    if(!isPdf && !isDocx){ state.uploadError = '&#9888;&#65039; Format file tidak dikenali. Gunakan file .docx atau .pdf.'; render(); return; }
    state.uploadError = isPdf ? 'Memproses file PDF...' : 'Memproses file...';
    state.uploadPreview = null;
    render();
    try{
      const buf = await file.arrayBuffer();
      let items;
      if(isPdf){
        items = await parsePdfToParagraphs(buf);
      } else {
        const zip = await JSZip.loadAsync(buf);
        const xmlFile = zip.file('word/document.xml');
        if(!xmlFile) throw new Error('&#9888;&#65039; Bukan file .docx yang valid. Pastikan file disimpan sebagai .docx (bukan .doc lama) dari Microsoft Word.');
        const xml = await xmlFile.async('string');
        let styleBoldMap = {};
        const stylesFile = zip.file('word/styles.xml');
        if(stylesFile){
          try{ styleBoldMap = getStyleBoldMap(await stylesFile.async('string')); } catch(e){ console.error(e); }
        }
        let numCtx = null;
        const numFile = zip.file('word/numbering.xml');
        if(numFile){ try{ numCtx = getNumberingMap(await numFile.async('string')); } catch(e){ console.error(e); } }
        items = parseDocxXml(xml, styleBoldMap, numCtx);
      }
      const sections = buildBankFromParagraphs(items);
      if(sections.length === 0 || sections.every(s => s.questions.length === 0)){
        throw new Error(isPdf
          ? '&#9888;&#65039; Tidak ada soal yang terdeteksi dari PDF. Pastikan file PDF punya lapisan teks (bukan hasil scan/foto) dan memakai heading "PILIHAN GANDA", "PILIHAN GANDA KOMPLEKS", "BENAR-SALAH", serta soal diberi nomor (1. 2. 3. dst).'
          : '&#9888;&#65039; Tidak ada soal yang terdeteksi. Pastikan naskah memakai heading "PILIHAN GANDA", "PILIHAN GANDA KOMPLEKS", dan "BENAR-SALAH", serta soal diberi nomor (1. 2. 3. dst).');
      }
      const warnings = [];
      sections.forEach(sec => {
        sec.questions.forEach(q => {
          if(sec.type === 'truefalse' && !q._sure) warnings.push(`No. ${q.num}: kunci Benar/Salah tidak terdeteksi (diisi Salah), periksa di Edit Soal`);
          if(sec.type === 'matching' && (!q.pairs || q.pairs.length < 2)) warnings.push(`No. ${q.num}: pasangan menjodohkan terdeteksi ${q.pairs ? q.pairs.length : 0} (minimal 2)`);
          if(sec.type === 'matching' && q._unsure) warnings.push(`No. ${q.num}: kunci menjodohkan tidak lengkap (dipasangkan berurutan), periksa di Edit Soal`);
          if(sec.type === 'short' && !(q.answers && q.answers.length)) warnings.push(`No. ${q.num}: kunci jawaban isian tidak terdeteksi (tulis "Kunci: jawaban" di bawah soal), isi di Edit Soal`);
          if(sec.type === 'single' || sec.type === 'multi'){
            const need = sec.type === 'multi' ? 2 : 1;
            const nCorrect = q.options.filter(o=>o.correct).length;
            if(nCorrect !== need) warnings.push(`No. ${q.num}: terdeteksi ${nCorrect} opsi tebal (seharusnya ${need})`);
          }
        });
      });
      state.uploadPreview = { sections, warnings };
      state.uploadError = '';
    } catch(e){
      console.error(e);
      state.uploadError = e.message && e.message.startsWith('&#9888;') ? e.message : ('&#9888;&#65039; Gagal memproses file: ' + (e.message||''));
      state.uploadPreview = null;
    }
    render();
  };

  const confirmUp = document.getElementById('btn-confirm-upload');
  if(confirmUp) confirmUp.onclick = async () => {
    if(!confirm('Bank soal aktif akan diganti dengan hasil upload, dan sesi/token ujian yang sedang berjalan akan otomatis ditutup agar siswa tidak mengerjakan soal lama. Lanjutkan?')) return;
    const newData = { meta: DATA.meta, sections: state.uploadPreview.sections };
    await saveBank(newData);
    if(state.session && state.session.status === 'open'){
      await saveSession({...state.session, status: 'closed'});
    }
    state.uploadPreview = null;
    state.uploadError = '&#9989; Bank soal baru berhasil disimpan dan aktif.';
    render();
  };
  const cancelUp = document.getElementById('btn-cancel-upload');
  if(cancelUp) cancelUp.onclick = () => { state.uploadPreview = null; render(); };
}

function attachSesiTabHandlers(){
  document.getElementById('btn-buat-token').onclick = async () => {
    if(!hasQuestions()){ alert('Bank soal masih kosong. Tambahkan atau unggah soal di tab Bank Soal sebelum membuat token.'); return; }
    const durasi = parseInt(document.getElementById('input-durasi').value, 10) || 70;
    const shuffleMode = document.getElementById('input-shuffle-per-siswa').checked ? 'per-siswa' : 'off';
    const jd = readJadwal(); if(jd.err){ alert(jd.err); return; }
    const token = generateToken();
    await saveSession({ token, status: 'open', durationMinutes: durasi, shuffleMode, createdAt: new Date().toISOString(), startAt: jd.startAt, endAt: jd.endAt });
    render();
  };
  document.getElementById('btn-simpan-kkm').onclick = async () => {
    const raw = document.getElementById('input-kkm').value.trim().replace(',', '.');
    const map = Object.assign({}, state.settings.kkmUjian || {});
    if(raw === '') delete map[state.examType];
    else {
      const n = Number(raw);
      if(!isFinite(n) || n < 0 || n > 100){ alert('KKM harus berupa angka 0\u2013100.'); return; }
      map[state.examType] = n;
    }
    state.settings.kkmUjian = map;
    await saveSettings();
    render();
    alert(raw === '' ? 'KKM ujian ini dikosongkan (memakai KKM umum).' : 'KKM ' + examInfo().label + ' disimpan: ' + raw + '.');
  };
  const jadwalBtn = document.getElementById('btn-simpan-jadwal');
  if(jadwalBtn) jadwalBtn.onclick = async () => {
    const jd = readJadwal(); if(jd.err){ alert(jd.err); return; }
    await saveSession({ ...state.session, startAt: jd.startAt, endAt: jd.endAt });
    alert('Jadwal ujian disimpan.');
    render();
  };
  const closeBtn = document.getElementById('btn-tutup-ujian');
  if(closeBtn) closeBtn.onclick = async () => {
    await saveSession({...state.session, status: 'closed'});
    render();
  };
  document.getElementById('btn-change-pass').onclick = async () => {
    const val = document.getElementById('input-new-pass').value.trim();
    if(!val){ alert('Kode tidak boleh kosong.'); return; }
    if(isUtama()){
      state.settings.guruPassword = val;
      await saveSettings();
    } else {
      const salt = Math.random().toString(36).slice(2, 10), hash = await hashPass(salt, val), id = state.teacher.id;
      await updateRegistry(list => list.map(t => t.id === id ? { ...t, salt, hash } : t));
    }
    alert('Kode akses guru berhasil diganti.');
    render();
  };
}

async function quickReopen(){
  const st = document.getElementById('quick-status');
  const say = (msg, err) => { st.className = 'recap-status' + (err ? ' error' : ''); st.textContent = msg; };
  const t = document.getElementById('quick-tingkat').value, pr = document.getElementById('quick-paralel').value;
  const ab = document.getElementById('quick-absen').value.trim(), nm = document.getElementById('quick-nama').value.trim();
  if(!t || !pr || !ab){ say('Pilih kelas, paralel, dan isi nomor absen terlebih dahulu.', true); return; }
  const kelas = `${t}-${pr}`;
  const base = { nama: nm, kelas, noAbsen: ab, ujian: state.examType };
  const ik = identKeys(base);
  const keys = new Set([ik.absenKey]);
  if(nm) keys.add(ik.nameKey);
  // nama persis seperti yang diketik siswa (dari data yang sudah termuat), agar kunci nama ikut terbuka
  const absN = v => String(v||'').trim().toLowerCase().replace(/^0+(?=\d)/,'');
  const known = [...(state.recap.pending||[]), ...(state.recap.rows||[])];
  const hasResult = known.some(x => x._key && String(x._key).indexOf('hasil:') === 0 && normKelas(x.kelas) === normKelas(kelas) && absN(x.noAbsen) === absN(ab));
  known.forEach(x => { if(normKelas(x.kelas) === normKelas(kelas) && absN(x.noAbsen) === absN(ab)) keys.add(identKeys({ nama: x.nama, kelas: x.kelas, noAbsen: x.noAbsen, ujian: state.examType }).nameKey); });
  const btn = document.getElementById('btn-quick-open'); btn.disabled = true; say('Memeriksa...');
  try{
    const list = [...keys];
    const exist = (await Promise.all(list.map(async k => { try{ const r = await window.storage.get(k, true); return (r && r.value) ? k : null; }catch(e){ return null; } }))).filter(Boolean);
    if(!exist.length){ say(`Tidak ditemukan data terblokir untuk ${kelas}, absen ${ab}. Mungkin sudah dibuka, atau kelas/nomor absen berbeda dari yang diisi siswa.`, true); btn.disabled = false; return; }
    const oks = await Promise.all(exist.map(k => window.storage.delete(k, true).then(() => true).catch(() => false)));
    exist.forEach(k => RECAP_CACHE.delete(NS + k)); saveRecapCache();
    state.recap.pending = (state.recap.pending||[]).filter(x => !keys.has(x._key));
    if(oks.every(Boolean)){
      say(`\u2705 Siswa kelas ${kelas}, absen ${ab}${nm ? ' (' + nm + ')' : ''} sudah dibuka kembali. Minta siswa membuka ulang aplikasi dan mengisi data lagi.` + (hasResult ? ' Catatan: siswa ini sudah punya hasil tersimpan; hasil lama tetap ada di rekap (hapus lewat tombol Buka Kembali di tabel kelas bila perlu).' : ''));
      document.getElementById('quick-absen').value = ''; document.getElementById('quick-nama').value = '';
    } else say('Sebagian kunci gagal dibuka. Coba klik Buka Kembali sekali lagi.', true);
    renderClassBoard();
  }catch(e){ console.error(e); say('Gagal membuka kembali. Periksa koneksi lalu coba lagi.', true); }

/* Baca word/styles.xml untuk menemukan style karakter/paragraf yang
   didefinisikan sebagai bold (mis. banyak guru menandai jawaban dengan
   style "Strong" / "Tebal" alih-alih menekan tombol Bold langsung).
   Mendukung pewarisan lewat <w:basedOn>. */
function getStyleBoldMap(stylesXmlText){
  const map = {};

  try{
    const doc = new DOMParser().parseFromString(stylesXmlText, 'application/xml');
    const ns = 'http://schemas.openxmlformats.org/wordprocessingml/2006/main';
    const styles = Array.from(doc.getElementsByTagNameNS(ns, 'style'));
    const raw = {};
    styles.forEach(st => {
      const id = st.getAttributeNS(ns, 'styleId') || st.getAttribute('w:styleId') || st.getAttribute('styleId');
      if(!id) return;
      let bold = null;
      const rPrList = st.getElementsByTagNameNS(ns, 'rPr');
      if(rPrList.length){
        const bList = rPrList[0].getElementsByTagNameNS(ns, 'b');
        if(bList.length){
          const val = bList[0].getAttributeNS(ns, 'val');
          bold = !(val === '0' || val === 'false' || val === 'off');
        }
      }
      const basedOnList = st.getElementsByTagNameNS(ns, 'basedOn');
      const basedOn = basedOnList.length ? basedOnList[0].getAttributeNS(ns, 'val') : null;

      return resolve(raw[id].basedOn, seen);
    }
    Object.keys(raw).forEach(id => { map[id] = resolve(id, new Set()); });

}

  }

  if(uList.length){
    const val = uList[0].getAttributeNS(ns, 'val');

  if(hList.length){

    const styleList = rPr.getElementsByTagNameNS(ns, 'rStyle');

}

  }

    const page = await pdf.getPage(pageNum);

    // Resolve status "bold" untuk tiap font unik yang dipakai di halaman ini

    const boldMap = {};

      let bold = false;
      try{
        const fontObj = await getPdfCommonObj(page, fn);
        const label = (fontObj && (fontObj.name || fontObj.fallbackName)) || '';
        bold = /bold|black|heavy/i.test(label);
      } catch(e){ bold = false; }
      boldMap[fn] = bold;
    }

    // Kelompokkan potongan teks menjadi baris berdasarkan posisi vertikal (y)
    const lineGroups = [];
    items.forEach(it => {
      const y = it.transform[5];
      let group = lineGroups.find(g => Math.abs(g.y - y) <= 2.5);
      if(!group){ group = { y, items: [] }; lineGroups.push(group); }
      group.items.push(it);
    });
    lineGroups.sort((a, b) => b.y - a.y); // atas ke bawah (sumbu y PDF terbalik)

    lineGroups.forEach(group => {
      group.items.sort((a, b) => a.transform[4] - b.transform[4]); // kiri ke kanan
      let text = '', boldText = '';
      let prevEndX = null, cells = [], cur = '';
      group.items.forEach(it => {
        const startX = it.transform[4];
        let piece = it.str;
        if(prevEndX !== null && startX - prevEndX > 1.5 && !/^\s/.test(piece) && text && !/\s$/.test(text)){

        }

      }

    throw new Error('&#9888;&#65039; PDF ini sepertinya tidak memiliki lapisan teks (kemungkinan hasil scan/foto). Gunakan PDF yang diekspor langsung dari Word/Google Docs.');

    if(curSection && curSection.type === 'matching'){ item.rows.forEach(r => matchRaw.items.push({ row: r.cells.map(c => c.text) })); return; }
    if(curSection && curSection.type === 'truefalse'){ item.rows.forEach(tfRow); return; }
    const flat = item.rows.every(r => r.cells.filter(c => c.text.trim()).length <= 1 || r.cells.some(c => /^([A-Fa-f]|\d+)[.\)]\s/.test(c.text.trim())));
    if(flat){ item.rows.forEach(r => r.flat.forEach(processItem)); return; }
    if(!curSection) return;
    curPassageLines.push('[TABLE]' + item.rows.map(r => r.cells.map(c => c.text.trim().replace(/\|/g, '/')).join('|')).join('\n') + '[/TABLE]');
  };
  function processItem(item){
    if(item.table){ processTable(item); return; }
    const t = (item.text || '').replace(/\t+/g, ' ').trim();
    if(!t) return;
    const up = t.toUpperCase();
    if(heading(t, up)){
      if(up.includes('KOMPLEKS')) return newSection('multi', t, 'Pilih 2 jawaban benar');
      if(/MENJODOHKAN|PENJODOHAN|MENCOCOKKAN|MATCHING/.test(up)) return newSection('matching', t, 'Pasangkan setiap pernyataan dengan jawaban yang tepat');
      const tfH = /BENAR\s*(?:[-\/\u2013\u2014,&]|\s+(?:ATAU|DAN)\s+)?\s*SALAH|TRUE\s*[-\/]?\s*FALSE/.test(up) && !/^[A-Da-d][.\)]\s*(benar|salah)\b/i.test(t) &&
        (/^[A-Ea-e][.\)]\s/.test(t) || /PERNYATAAN|BAGIAN|SOAL|TIPE|PILIH/.test(up) || !(curSection && curSection.type === 'truefalse' && curQuestion));
      if(tfH) return newSection('truefalse', t, 'Pilih salah satu (Benar atau Salah)');
      const txH = up.length <= 70 && /^(?:[A-Z]{1,3}[.\)]\s*|BAGIAN\s+[A-Z0-9]+\s*[:.\-–—]?\s*|SOAL\s+|TIPE\s+[A-Z0-9]*\s*[:.\-]?\s*|BENTUK\s+)?(ISIAN|URAIAN|ESAI|ESSAY)\b/.exec(up);
      if(txH) return /ISIAN/.test(txH[1]) ? newSection('short', t, SEC_TYPES.short.instr) : newSection('essay', t, SEC_TYPES.essay.instr);
      if(up.includes('PILIHAN GANDA')) return newSection('single', t, 'Pilih satu jawaban paling tepat');
    }
    if(!curSection) return;
    if(curSection.type === 'matching'){ matchRaw.items.push({ text: item.text, cells: item.cells || (/\t/.test(item.text) ? item.text.split(/\t+/) : null) }); return; }

    if(curSection.type === 'short' || curSection.type === 'essay'){
      const km = t.match(/^(?:kunci(?:\s+jawaban)?|jawaban|pedoman(?:\s+penskoran|\s+penilaian)?|rubrik(?:\s+penilaian)?)\s*[:=]\s*(.*)$/i);
      if(km && curQuestion){
        if(curSection.type === 'short') curQuestion.answers = km[1].split(/\s*(?:;|\||\s\/\s)\s*/).map(s => s.trim()).filter(Boolean);
        else { curQuestion.key = km[1].trim(); keyOpenQ = curQuestion; }
        return;
      }
      const sm = t.match(/^(?:skor(?:\s+maksimal)?|bobot|nilai\s+maksimal|poin)\s*[:=]\s*(\d+(?:[.,]\d+)?)/i);
      if(sm && curQuestion){ const v = parseFloat(sm[1].replace(',', '.')); if(v > 0) curQuestion.pts = v; return; }
      if(keyOpenQ && /^[-•*–]\s*\S/.test(t)){ keyOpenQ.key += '\n' + t; return; }
    }
    let m = t.match(/^([A-Fa-f])[.\)]\s*(.*)$/);
    if(m && curQuestion && (curSection.type === 'single' || curSection.type === 'multi')){
      curQuestion.options.push({ label: m[1].toUpperCase(), text: m[2].trim(), correct: isBoldDominant(item) });
      return;
    }
    if(curSection.type === 'truefalse' && curQuestion){
      const jm = t.match(/^(?:kunci\s+jawaban|jawaban|kunci)\s*[:=\-]\s*(benar|salah|b|s)\b/i);
      if(jm){ setKey(curQuestion, /^b/i.test(jm[1])); return; }
      if(!/^\d+[.\)]/.test(t) && t.replace(/[^A-Za-z]/g, '').length < 24 && new RegExp('^[\\s(\\[' + CHK + BOX + '.\\-\\u2022*]*(?:[A-Da-d][.\\)]\\s*)?(benar|salah)\\b', 'i').test(t)){
        const bB = /benar/i.test(item.boldText), bS = /salah/i.test(item.boldText);
        const cB = new RegExp('[' + CHK + ']\\s*(?:[A-Da-d][.\\)]\\s*)?benar', 'i').test(t), cS = new RegExp('[' + CHK + ']\\s*(?:[A-Da-d][.\\)]\\s*)?salah', 'i').test(t);
        if((bB && !bS) || (cB && !cS)) setKey(curQuestion, true); else if((bS && !bB) || (cS && !cB)) setKey(curQuestion, false);
        return;
      }
    }
    m = t.match(/^(\d+)[.\)]\s*(.*)$/);
    if(m){
      const num = parseInt(m[1], 10), rest = m[2].trim();
      if(curSection.type === 'truefalse'){
        if(/^(benar|salah|b|s)\.?$/i.test(rest)){ const tq = curSection.questions.find(q => q.num === num); if(tq){ setKey(tq, /^b/i.test(rest)); return; } }
        let st = rest.replace(/^Pernyataan:\s*/i, '').trim(), key = null;
        const op = st.match(new RegExp('\\s*[(\\[]?\\s*([' + CHK + BOX + ']?)\\s*(?:benar|b)\\s*[\\/,|\\u2013\\u2014-]?\\s*([' + CHK + BOX + ']?)\\s*(?:salah|s)\\s*[)\\]]?\\s*$', 'i'));
        if(op){
          const bB = /benar/i.test(item.boldText), bS = /salah/i.test(item.boldText), dom = isBoldDominant(item);
          const c1 = new RegExp('[' + CHK + ']').test(op[1]), c2 = new RegExp('[' + CHK + ']').test(op[2]);
          if(c1 !== c2) key = c1; else if(!dom && bB !== bS) key = bB;
          st = st.slice(0, op.index).trim();
        } else {
          const km = st.match(/(?:\(\s*|\[\s*|jawaban\s*:\s*|kunci\s*:\s*|[-\u2013\u2014\u2192:]\s*)(benar|salah|b|s)\s*[\)\]]?\s*\.?\s*$/i);
          if(km){ key = /^b/i.test(km[1]); st = st.slice(0, km.index).trim(); }
        }
        addTF(num, st, key); return;
      }
      const passage = flushPassage();
      keyOpenQ = null;
      if(curSection.type === 'short'){
        let stem = rest, answers = [];
        const im = stem.match(/\s*[\(\[]\s*(?:kunci|jawaban)\s*[:=]\s*([^\)\]]+)[\)\]]\s*$/i);
        if(im){ answers = im[1].split(/\s*(?:;|\||\s\/\s)\s*/).map(s => s.trim()).filter(Boolean); stem = stem.slice(0, im.index).trim(); }
        curQuestion = { num, passage, stem, answers, pts: 1 };
      } else if(curSection.type === 'essay'){
        let stem = rest, pts = ESSAY_DEFAULT_PTS;
        const pm = stem.match(/\s*[\(\[]\s*(?:(?:skor|bobot|nilai)\s*[:=]?\s*(\d+(?:[.,]\d+)?)|(\d+(?:[.,]\d+)?)\s*(?:poin|skor))\s*[\)\]]\s*$/i);
        if(pm){ pts = parseFloat((pm[1] || pm[2]).replace(',', '.')) || pts; stem = stem.slice(0, pm.index).trim(); }
        curQuestion = { num, passage, stem, key: '', pts };
      } else {
        curQuestion = { num, passage, stem: rest, options: [] };
      }
      curSection.questions.push(curQuestion);
      return;
    }
    curPassageLines.push(t);
  }
  items.forEach(processItem);
  closeMatching();
  const kept = sections.filter(s => s.questions.length > 0);
  kept.forEach((s, i) => { s.id = 'ABCDEFGHIJKL'[i] || ('Z' + i); });
  let last = 0; // nomor soal harus unik & berurutan lintas bagian (dipakai sebagai kunci jawaban siswa)
  kept.forEach(sc => sc.questions.forEach(q => { if(!(q.num > last)) q.num = last + 1; last = q.num; }));
  return kept;
}

      </div>
    </div>
    <div class="navrow"><span></span><button class="btn primary" id="btn-token-lanjut">Lanjutkan &rarr;</button></div>
  </div>
  <div class="navrow"><button class="btn ghost" id="btn-back-role">&larr; Kembali</button><span></span></div>`;

function attachSiswaTokenHandlers(){
  document.getElementById('btn-back-role').onclick = () => { state.view = 'siswa_menu'; render(); };
  const field = document.getElementById('field-token');
  const doSubmit = () => {
    const val = document.getElementById('input-token').value.trim().toUpperCase();
    let bad = false;
    if(!state.session || state.session.status !== 'open'){
      state.tokenError = 'Ujian belum dibuka oleh guru. Silakan tunggu instruksi guru.'; bad = true;
    } else if(val === ''){
      state.tokenError = 'Token wajib diisi.'; bad = true;
    } else if(val !== state.session.token){
      state.tokenError = 'Token salah. Periksa kembali dengan guru Anda.'; bad = true;
    } else if(checkJadwal(state.session)){
      state.tokenError = checkJadwal(state.session); bad = true;
    }
    field.classList.toggle('invalid', bad);
    if(bad){ render(); return; }
    state.tokenError = '';
    state.tokenVerified = true;
    state.timerSeconds = (state.session.durationMinutes || 70) * 60;
    state.view = 'start';
    render();
  };
  document.getElementById('btn-token-lanjut').onclick = doSubmit;
  document.getElementById('input-token').onkeydown = e => { if(e.key === 'Enter') doSubmit(); };
}

const KELAS_TINGKAT = ['VII','VIII','IX'];
const KELAS_PARALEL = 'ABCDEFGHIJK'.split('');
function parseKelasPick(k){
  const m = String(k||'').toUpperCase().match(/^(VIII|VII|IX)\s*[-_. ]?\s*([A-K])$/);
  if(m) return {tingkat:m[1], paralel:m[2]};
  const g = String((DATA.meta||{}).grade||'').trim().toUpperCase();
  return {tingkat: KELAS_TINGKAT.includes(g) ? g : '', paralel:''};
}
function renderRulesBox(){
  if(isPractice()) return `<div class="rules-box" style="border-left-color:var(--teal);"><strong>&#9999;&#65039; Mode Latihan</strong>
      <ul><li>Latihan boleh diulang berkali-kali.</li><li>Hasil latihan <strong>tidak dicatat</strong> di rekap guru.</li></ul></div>`;
  return `<div class="rules-box"><strong>&#128274; Aturan Ujian</strong>
      <ul>
        <li>Ujian hanya bisa dikerjakan <strong>satu kali</strong>. Menutup atau memuat ulang halaman tidak memberi kesempatan kedua.</li>
        <li>Selama ujian, <strong>jangan berpindah ke aplikasi, tab, atau jendela lain</strong>. Setiap perpindahan tercatat dan dilaporkan ke guru.</li>
        <li>Pelanggaran ke-${LOCK_MAX} membuat ujian <strong>berakhir otomatis</strong> dan jawaban yang sudah terisi langsung dinilai.</li>
      </ul>
    </div>`;
}

      <button class="btn primary" id="btn-start">Mulai Mengerjakan &rarr;</button>
    </div>
  </div>
  <footer>Lengkapi data diri, lalu klik &ldquo;Mulai Mengerjakan&rdquo; untuk membuka soal.</footer>`;

function attachStartHandlers(){
  const btn = document.getElementById('btn-start');
  if(!btn) return;
  btn.onclick = async () => {
    const nama = document.getElementById('input-nama').value.trim();
    const tingkat = document.getElementById('select-tingkat').value;
    const paralel = document.getElementById('select-paralel').value;
    const kelas = (tingkat && paralel) ? `${tingkat}-${paralel}` : '';
    const noAbsen = document.getElementById('input-absen').value.trim();
    let valid = true;
    const setInvalid = (id, bad) => {
      const el = document.getElementById(id);
      el.classList.toggle('invalid', bad);
      if(bad) valid = false;
    };
    setInvalid('field-nama', nama === '');
    setInvalid('field-kelas', kelas === '');
    setInvalid('field-absen', noAbsen === '');
    if(!valid) return;
    if(!hasQuestions()){ const eb = document.getElementById('start-block'); eb.style.display = 'block'; eb.textContent = 'Soal belum tersedia. Hubungi guru Anda.'; return; }

    if(!isPractice()){
      const jErr = checkJadwal(state.session);
      if(jErr){ const jb = document.getElementById('start-block'); jb.style.display = 'block'; jb.textContent = jErr; return; }
      enterFullscreen(); // harus dipanggil langsung dari klik
      btn.disabled = true; btn.textContent = 'Memeriksa data...';
      const blockedMsg = await checkAlreadyAttempted({ nama, kelas, noAbsen, ujian: state.examType });
      if(blockedMsg){
        exitFullscreen();
        btn.disabled = false; btn.innerHTML = 'Mulai Mengerjakan &rarr;';
        const box = document.getElementById('start-block');
        box.style.display = 'block'; box.textContent = blockedMsg;
        return;
      }
      await markAttempt({ nama, kelas, noAbsen, ujian: state.examType });
    } else {
      state.timerSeconds = (parseInt(DATA.meta.duration, 10) || 70) * 60;
    }
    LOCK.violations = 0; LOCK.forced = false; LOCK.last = 0;
    state.resultSaved = false; state.deadline = null;
    state.student = { nama, kelas, noAbsen };
    prepareTestQuestions();
    state.answers = {};
    state.currentSection = ALL_Q[0].sectionId;
    state.currentNum = ALL_Q[0].num;
    state.view = 'test';
    render();
  };
}

      return `<div class="tab ${state.currentSection===sec.id?'active':''}" data-sec="${sec.id}">
        <div class="tab-name">${escapeHtml(sec.label)}</div>
        <div class="tab-count">${answered}/${qs.length} terjawab &middot; ${escapeHtml(sec.instruction)}</div>
      </div>`;
    }).join('')}
  </div>`;
}
function renderPalette(){
  const qs = sectionQuestions(state.currentSection);
  return `<div class="palette">
    <div class="palette-title">Navigasi Soal &mdash; Bagian ${state.currentSection}</div>
    <div class="palette-grid">
      ${qs.map(q => `<div class="pill ${isAnswered(q.num)?'answered':''} ${q.num===state.currentNum?'current':''}" data-num="${q.num}">${q.num}</div>`).join('')}
    </div>
  </div>`;
}
function renderQuestion(){
  const q = Q_BY_NUM[state.currentNum];
  const sec = DATA.sections.find(s => s.id === q.sectionId);
  const passage = effectivePassage(q);
  let bodyHtml = '';
  if(sec.type === 'single'){
    const sel = state.answers[q.num];
    bodyHtml = `<div class="options">` + q.options.map(o => `
      <div class="opt ${sel===o.label?'selected':''}" data-label="${o.label}">
        <span class="letter">${o.label}</span><span>${escapeHtml(o.text)}</span>
      </div>`).join('') + `</div>`;
  } else if(sec.type === 'multi'){
    const sel = state.answers[q.num] || [];
    bodyHtml = `<div class="options">` + q.options.map(o => `
      <div class="opt ${sel.includes(o.label)?'selected':''}" data-label="${o.label}">
        <span class="letter">${o.label}</span><span>${escapeHtml(o.text)}</span>
      </div>`).join('') + `</div>`;
  } else if(sec.type === 'truefalse'){
    const sel = state.answers[q.num];
    bodyHtml = `<div class="tf-row">
      <div class="tf-btn ${sel==='Benar'?'selected':''}" data-val="Benar">Benar</div>
      <div class="tf-btn ${sel==='Salah'?'selected':''}" data-val="Salah">Salah</div>
    </div>`;
  }
  else if(sec.type === 'matching'){
    const sel = state.answers[q.num] || [];
    bodyHtml = `<div class="mt-list">` + q.pairs.map((pr,i) => `
      <div class="mt-row"><div class="mt-left">${i+1}. ${escapeHtml(pr.left)}</div>
      <select class="mt-sel" data-i="${i}"><option value="">&mdash; Pilih pasangan &mdash;</option>` +
      q.pool.map((r,j) => `<option value="${j}" ${(sel[i]===r && q.pool.indexOf(r)===j)?'selected':''}>${escapeHtml(r)}</option>`).join('') +
      `</select></div>`).join('') + `</div>`;
  }
  else if(sec.type === 'short'){
    const cur = state.answers[q.num] == null ? '' : String(state.answers[q.num]);
    bodyHtml = `<input type="text" class="short-in" id="ans-text" maxlength="${SHORT_MAX_LEN}" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Ketik jawabanmu di sini" value="${escAttr(cur)}">
      <div class="ans-note">Ketik jawaban singkat saja. Huruf besar/kecil tidak berpengaruh.</div>`;
  }
  else if(sec.type === 'essay'){
    const cur = state.answers[q.num] == null ? '' : String(state.answers[q.num]);
    bodyHtml = `<textarea class="essay-in" id="ans-text" maxlength="${ESSAY_MAX_LEN}" spellcheck="false" placeholder="Tulis jawaban uraianmu di sini...">${escapeHtml(cur)}</textarea>
      <div class="essay-meta"><span>Skor maksimal ${fmtPts(qMax(q, 'essay'))} poin &middot; dinilai oleh guru</span><span id="ans-count">${cur.length}/${ESSAY_MAX_LEN} karakter</span></div>`;
  }
  const stemText = sec.type === 'truefalse' ? q.statement : q.stem;
  const idx = sectionQuestions(q.sectionId).findIndex(x=>x.num===q.num);
  const total = sectionQuestions(q.sectionId).length;
  return `
    ${passage ? renderPassageBlock(passage) : ''}
    <div class="qcard">
      <div class="qnum-row">
        <span class="qnum">No. ${q.num}</span>
        <span class="qtype-hint">${escapeHtml(sec.instruction)} &middot; Soal ${idx+1} dari ${total} (Bagian ${q.sectionId})</span>
      </div>
      <p class="qstem">${escapeHtml(stemText)}</p>
      ${bodyHtml}
    </div>
    <div class="navrow">
      <button class="btn" id="btn-prev" ${globalIdx(q.num)===0?'disabled':''}>&larr; Sebelumnya</button>
      <button class="btn primary" id="btn-next" ${globalIdx(q.num)===ALL_Q.length-1?'disabled':''}>Berikutnya &rarr;</button>
    </div>`;
}
function renderTestView(){
  return renderHeader() + renderStatusbar() + renderTabs() + renderPalette() + renderQuestion() +
    `<footer>Jawablah seluruh butir soal, lalu klik &ldquo;Selesai &amp; Lihat Nilai&rdquo; untuk melihat hasil.</footer>`;

function renderStatusbar(){
  const answeredCount = ALL_Q.filter(q => isAnswered(q.num)).length;
  const pct = Math.round((answeredCount/ALL_Q.length)*100);
  const warn = state.timerSeconds <= 300;
  return `
  <div class="statusbar">
    <div class="timer ${warn?'warn':''}" title="Waktu berjalan otomatis dan tidak dapat dijeda">&#9201; ${formatTime(state.timerSeconds)}</div>
    <div class="progress-wrap">
      <div class="progress-label"><span>Progres pengerjaan</span><span>${answeredCount}/${ALL_Q.length}</span></div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
    </div>
    <button id="btn-finish" class="btn-finish">Selesai &amp; Lihat Nilai</button>
  </div>`;
}
function startTimer(){
  if(state.timerInterval) return;
  state.timerRunning = true;
  state.deadline = Date.now() + state.timerSeconds * 1000;
  if(!isPractice() && state.session && state.session.endAt){
    const endMs = new Date(state.session.endAt).getTime();
    if(endMs > Date.now()) state.deadline = Math.min(state.deadline, endMs);
  }
  state.timerInterval = setInterval(()=>{
    state.timerSeconds = Math.max(0, Math.round((state.deadline - Date.now())/1000));
    updateTimerDisplay();
    if(state.timerSeconds <= 0){
      clearInterval(state.timerInterval);
      state.timerInterval = null;
