/* ---- Hasil ---- */
function computeResultPayload(){
  const S = scoreSummary();
  const p = {
    nama: state.student.nama, kelas: state.student.kelas, noAbsen: state.student.noAbsen,
    totalCorrect: S.autoCorrect, totalQ: S.autoN, percentage: S.pct,
    perSection: S.perSection.map(s => ({ id: s.sec.id, label: s.sec.label, correct: s.correct, total: s.total, type: s.sec.type, pts: s.pts, max: s.max })),
    ujian: state.examType, pelanggaran: LOCK.violations, selesaiPaksa: LOCK.forced,
    submittedAt: new Date().toISOString(),
  };
  const teks = collectTeks();
  if(teks.length){
    p.autoPts = S.autoPts; p.autoMax = S.autoMax; p.essayMax = S.essayMax; p.essayN = S.essayN; p.maxPts = S.maxPts;
    p.teks = teks;
    // batas ukuran satu entri penyimpanan (sel Google Sheets maks. 50.000 karakter)
    for(let i = 0; i < 12 && JSON.stringify(p).length > 45000; i++){
      const big = p.teks.slice().sort((a, b) => b.a.length - a.a.length)[0];
      if(!big || big.a.length < 50) break;
      big.a = big.a.slice(0, Math.floor(big.a.length * 0.8));
    }
  }
  return p;
}
async function persistResult(){
  state.saveStatus = 'saving'; setSaveStatusUI();
  let key = null;
  try{
    const payload = computeResultPayload();
    let nid = '';
    try{ nid = identKeys({ nama: payload.nama, kelas: payload.kelas, noAbsen: payload.noAbsen, ujian: state.examType }).nameKey.slice(6); }catch(e){}
    key = `hasil:${Date.now()}_${Math.random().toString(36).slice(2,8)}` + (nid ? '_' + nid : '');
    const value = JSON.stringify(payload);
    state.lastResultKey = key;
    outboxAdd({ key, ns: NS, value });          // cadangan di perangkat siswa
    if(!window.storage) throw new Error('storage tidak tersedia');
    const result = await storageSet(key, value);
    if(result){ outboxRemove(key); state.saveStatus = 'saved'; }
    else { state.saveStatus = 'error'; flushOutbox(); }
  } catch(e){
    console.error('Gagal menyimpan hasil otomatis:', e);
    state.saveStatus = 'error';
    if(key) { clearTimeout(OUTBOX_TIMER); OUTBOX_TIMER = setTimeout(flushOutbox, 4000); }
  }
  setSaveStatusUI();
}

async function fetchAllRecapEntries(onProgress){
  if(!window.storage) throw new Error('storage tidak tersedia');
  const listRes = await window.storage.list('hasil:', true);
  const keys = (listRes && listRes.keys) ? listRes.keys : [];
  LAST_HASIL_KEYS = keys.slice();
  let done = 0; const total = keys.length;
  const parsed = await poolMap(keys, 12, async k => {
    const ck = NS + k;
    let o = RECAP_CACHE.get(ck);
    if(!o){
      const r = await getRetry(k, true);
      if(r && r.value){ try{ o = JSON.parse(r.value); RECAP_CACHE.set(ck, o); }catch(e){} }
    }
    done++; if(onProgress) onProgress(done, total);
    return o ? Object.assign({}, o, { _key: k }) : null;
  });
  saveRecapCache();
  const rows = parsed.filter(o => o && (o.ujian || 'formatif') === state.examType);
  rows.sort((a,b) => new Date(a.submittedAt) - new Date(b.submittedAt));
  await loadEssayGrades(rows);
  return rows;
}
/* ---- Nilai uraian: disimpan terpisah (kunci 'uraian:<id hasil>') karena entri hasil siswa tidak pernah berubah ---- */
function gradeKeyOf(r){ return 'uraian:' + String(r._key || '').replace(/^hasil:/, ''); }
function applyGrade(r){
  if(!(r.essayMax > 0)) return;
  r.perSection = (r.perSection || []).map(p => ({...p}));
  const sc = (r.grade && r.grade.scores) || {};
  let ep = 0, missing = 0; const bySec = {};
  (r.teks || []).filter(x => x.t === 'essay').forEach(x => {
    const v = sc[x.n];
    if(v === undefined || v === null || v === ''){ missing++; return; }
    const n = Math.min(Math.max(Number(v) || 0, 0), x.m);
    ep += n; bySec[x.sec] = (bySec[x.sec] || 0) + n;
  });
  r.essayPts = Math.round(ep * 100) / 100; r.essayMissing = missing; r.essayPending = missing > 0;
  r.perSection.forEach(p => { if(p.type === 'essay'){ p.pts = Math.round((bySec[p.id] || 0) * 100) / 100; p.pending = r.essayPending; } });
  r.percentage = r.maxPts ? Math.round((r.autoPts + ep) / r.maxPts * 100) : 0;
}
async function loadEssayGrades(rows){
  const need = rows.filter(r => r.essayMax > 0 && r._key);
  if(!need.length) return;
  await poolMap(need, 10, async r => {
    try{ const g = await getRetry(gradeKeyOf(r), true); r.grade = (g && g.value) ? JSON.parse(g.value) : null; }catch(e){ r.grade = null; }
    applyGrade(r);
  });
}
async function saveEssayGrade(r, scores, note){
  const val = { scores, note: note || '', gradedAt: new Date().toISOString(), ujian: state.examType };
  await storageSet(gradeKeyOf(r), JSON.stringify(val));
  r.grade = val; applyGrade(r);
}

  const nmEx = examInfo().label;
  if(!confirm(`Yakin ingin menghapus SEMUA data rekap nilai ${nmEx}? Semua siswa untuk jenis ujian ini juga dibuka kembali (boleh mengerjakan lagi). Data jenis ujian lain tidak ikut terhapus. Tindakan ini tidak bisa dibatalkan.`)) return;

    const listRes = await window.storage.list('mulai:', true);

    });

  state.recap.loading = false; setRecapUI();
}



/* ======================================================================
   SATU KALI PENGERJAAN + KUNCI UJIAN
   ====================================================================== */
const LOCK_MAX = 3;
const LOCK = { active:false, violations:0, forced:false, last:0, bound:false, fsWanted:false };
const ATTEMPT_MSG = 'Data ini sudah tercatat pernah masuk ke ujian (nama atau nomor absen pada kelas yang sama). Ujian hanya bisa dikerjakan satu kali. Jika ini kesalahan, hubungi guru untuk membuka kembali.';

function hashStr(str){
  let a = 5381, b = 0;
  for(let i=0;i<str.length;i++){ const c = str.charCodeAt(i); a = ((a<<5)+a+c)>>>0; b = (Math.imul(b,31)+c)>>>0; }
  return a.toString(36) + b.toString(36);
}
function identKeys(st){
  const k = normKelas(st.kelas);
  const tp = (st.ujian && st.ujian !== 'formatif') ? st.ujian + '|' : '';
  const nm = String(st.nama||'').trim().toLowerCase().replace(/\s+/g,' ');
  const ab = String(st.noAbsen||'').trim().toLowerCase().replace(/^0+(?=\d)/,'');
  return { nameKey: `mulai:n${hashStr(tp+k+'|'+nm)}`, absenKey: `mulai:a${hashStr(tp+k+'|'+ab)}` };
}
async function checkAlreadyAttempted(st){
  const { nameKey, absenKey } = identKeys(st);
  if(window.storage){
    const hits = await Promise.all([nameKey, absenKey].map(async key => {
      try{ const r = await window.storage.get(key, true); return !!(r && r.value); }catch(e){ return false; }
    }));
    if(hits.some(Boolean)) return ATTEMPT_MSG;
  } else {
    try{ if(localStorage.getItem(nameKey) || localStorage.getItem(absenKey)) return ATTEMPT_MSG; }catch(e){}
  }
  return '';
}
async function markAttempt(st){
  const { nameKey, absenKey } = identKeys(st);
  const val = JSON.stringify({ nama: st.nama, kelas: st.kelas, noAbsen: st.noAbsen, ujian: st.ujian || 'formatif', startedAt: new Date().toISOString() });
  if(window.storage){
    await Promise.all([nameKey, absenKey].map(key => storageSet(key, val).catch(e => console.error(e))));
  } else {
    try{ localStorage.setItem(nameKey, val); localStorage.setItem(absenKey, val); }catch(e){}
  }
}
function enterFullscreen(){
  try{ const el = document.documentElement; const fn = el.requestFullscreen || el.webkitRequestFullscreen; if(fn){ const r = fn.call(el); if(r && r.catch) r.catch(()=>{}); } }catch(e){}

function exitFullscreen(){
  try{ if(document.fullscreenElement || document.webkitFullscreenElement){ const fn = document.exitFullscreen || document.webkitExitFullscreen; const r = fn.call(document); if(r && r.catch) r.catch(()=>{}); } }catch(e){}
}
function showLockOverlay(reason){
  let ov = document.getElementById('lock-overlay');
  if(!ov){ ov = document.createElement('div'); ov.id = 'lock-overlay'; ov.className = 'lock-overlay'; document.body.appendChild(ov); }
  ov.innerHTML = `<div class="lock-box">
    <h3>&#9888;&#65039; Peringatan</h3>
    <p>${reason}<br>Perpindahan ini tercatat dan dilaporkan ke guru.</p>
    <div class="lock-count">Pelanggaran ${LOCK.violations} dari ${LOCK_MAX}</div>
    <p style="font-size:13px;color:var(--ink-soft);">Pada pelanggaran ke-${LOCK_MAX}, ujian berakhir otomatis.</p>
    <button class="btn primary" id="btn-lock-back">Kembali ke Ujian</button>
  </div>`;
  document.getElementById('btn-lock-back').onclick = () => { ov.remove(); enterFullscreen(); };
}
function lockViolation(reason){
  if(!LOCK.active) return;
  const now = Date.now();
  if(now - LOCK.last < 1500) return;
  LOCK.last = now;
  LOCK.violations++;
  if(LOCK.violations >= LOCK_MAX){ LOCK.forced = true; finishExam(); return; }
  showLockOverlay(reason);
}
function finishExam(){

function startExamLock(){
  if(LOCK.active) return;
  LOCK.active = true;
  LOCK.fsWanted = !!(document.fullscreenElement || document.webkitFullscreenElement);
  document.body.classList.add('exam-lock');
  if(LOCK.bound) return;
  LOCK.bound = true;
  document.addEventListener('visibilitychange', () => { if(document.hidden) lockViolation('Kamu meninggalkan halaman atau aplikasi ujian.'); });
  window.addEventListener('blur', () => lockViolation('Halaman ujian tidak lagi aktif (kamu berpindah aplikasi, tab, atau jendela).'));
  window.addEventListener('pagehide', () => lockViolation('Halaman ujian ditinggalkan.'));
  const onFs = () => {
    const on = !!(document.fullscreenElement || document.webkitFullscreenElement);
    if(on){ if(LOCK.active) LOCK.fsWanted = true; }
    else if(LOCK.active && LOCK.fsWanted){ LOCK.fsWanted = false; lockViolation('Kamu keluar dari mode layar penuh.'); }
  };
  document.addEventListener('fullscreenchange', onFs);
  document.addEventListener('webkitfullscreenchange', onFs);
  ['copy','cut','paste','contextmenu','dragstart'].forEach(ev => document.addEventListener(ev, e => { if(LOCK.active) e.preventDefault(); }));
  window.addEventListener('beforeunload', e => { if(LOCK.active){ e.preventDefault(); e.returnValue = ''; } });
}
function stopExamLock(){
  LOCK.active = false;
  document.body.classList.remove('exam-lock');
  const ov = document.getElementById('lock-overlay'); if(ov) ov.remove();
  exitFullscreen();
}

   Kunci: tugas:<itemLKM>:<siswa>  = data pengumpulan + nilai

const LKM_MAX_DOC = 450 * 1024;   // batas ukuran berkas non-gambar
const LKM_MAX_IMG = 260 * 1024;   // gambar dikompres hingga kira-kira segini
const LKM_IDENT_LS = 'lkm_ident_v1';
function newItemId(){ return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }
function itemKeyOf(it){ return String(it.id || ('x' + hashStr(it.judul || ''))).replace(/[^A-Za-z0-9]/g, ''); }
function escAttr(s){ return escapeHtml(s).replace(/"/g, '&quot;'); }
function safeHref(u){ return /^https?:\/\//i.test(u || '') ? escapeHtml(u).replace(/"/g, '%22') : ''; }
function nameNorm(s){ return String(s || '').trim().toLowerCase().replace(/\s+/g, ' '); }
function fmtWaktu(iso){ return iso ? new Date(iso).toLocaleString('id-ID') : '-'; }
function lkmState(){
  if(!state.lkm){
    state.lkm = { nama:'', tingkat:'', paralel:'', noAbsen:'', status:{}, openForm:null, busy:false };
    try{ Object.assign(state.lkm, JSON.parse(localStorage.getItem(LKM_IDENT_LS) || '{}')); }catch(e){}
  }

}
function lkmPersist(){ const s = lkmState(); try{ localStorage.setItem(LKM_IDENT_LS, JSON.stringify({ nama:s.nama, tingkat:s.tingkat, paralel:s.paralel, noAbsen:s.noAbsen })); }catch(e){} }
function lkmKelas(){ const s = lkmState(); return (s.tingkat && s.paralel) ? `${s.tingkat}-${s.paralel}` : ''; }

    ${canSend ? form : ''}

}
async function lkmFetchStatus(items){
  const s = lkmState(), sid = lkmStudentId();
  await Promise.all(items.map(async it => {
    const ik = itemKeyOf(it); let st = null;
    try{
      const r = await getRetry(`tugas:${ik}:${sid}`, true);
      if(r && r.value){ const m = JSON.parse(r.value); st = nameNorm(m.nama) === nameNorm(s.nama) ? m : 'mismatch'; }
    }catch(e){}
    s.status[ik] = st;
  }));
}
function lkmCompressImage(file){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onerror = () => rej(new Error('Berkas tidak dapat dibaca.'));
    rd.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('Gambar tidak dapat dibaca. Gunakan foto berformat JPG atau PNG.'));
      im.onload = () => {
        let maxDim = 1400, q = 0.75, out = '';
        for(let i = 0; i < 8; i++){
          const sc = Math.min(1, maxDim / Math.max(im.width, im.height));
          const c = document.createElement('canvas');
          c.width = Math.max(1, Math.round(im.width * sc)); c.height = Math.max(1, Math.round(im.height * sc));
          const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height);
          out = c.toDataURL('image/jpeg', q);
          if(out.length * 0.75 <= LKM_MAX_IMG) break;
          q = Math.max(0.4, q - 0.1); maxDim = Math.round(maxDim * 0.85);
        }
        res({ b64: out.split(',')[1], type: 'image/jpeg', name: file.name.replace(/\.[^.]+$/, '') + '.jpg' });
      };
      im.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}
function lkmReadFile(file){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onerror = () => rej(new Error('Berkas tidak dapat dibaca.'));
    rd.onload = () => res({ b64: String(rd.result).split(',')[1] || '', type: file.type || 'application/octet-stream', name: file.name });
    rd.readAsDataURL(file);
  });
}
async function lkmDeleteChunks(ik, sid, ver, n){
  const ks = []; for(let i = 0; i < (n || 0); i++) ks.push(`tugasf:${ik}:${sid}:${ver}:${i}`);
  await poolMap(ks, 6, async k => { try{ await window.storage.delete(k, true); }catch(e){} });
}
async function lkmSend(it){
  const s = lkmState(), ik = itemKeyOf(it);
  const prog = (m, err) => { const e = document.getElementById('lkm-prog'); if(e){ e.className = 'recap-status' + (err ? ' error' : ''); e.textContent = m; } };
  if(s.busy) return;
  if(!window.storage){ prog('Penyimpanan bersama belum aktif, tugas tidak dapat dikirim. Hubungi guru.', true); return; }
  if(!lkmIdentOk()){ prog('Lengkapi nama, kelas, paralel, dan nomor absen di atas terlebih dahulu.', true); return; }
  const file = (document.getElementById('lkm-file').files || [])[0];
  let link = document.getElementById('lkm-link').value.trim();
  const catatan = document.getElementById('lkm-cat').value.trim();
  if(!file && !link){ prog('Pilih berkas atau tempel link tugas terlebih dahulu.', true); return; }
  if(link){
    if(!/^https?:\/\//i.test(link)) link = 'https://' + link;
    try{ link = new URL(link).href; }catch(e){ prog('Link tidak valid.', true); return; }
  }
  if(file && !/^image\//i.test(file.type) && file.size > LKM_MAX_DOC){
    prog('Berkas terlalu besar (' + Math.round(file.size / 1024) + ' KB, maks. 450 KB). Unggah ke Google Drive lalu tempel linknya, atau kecilkan berkasnya.', true); return;
  }
  s.busy = true;
  const btn = document.getElementById('btn-lkm-send'); if(btn) btn.disabled = true;
  try{
    const sid = lkmStudentId(), key = `tugas:${ik}:${sid}`;
    prog('Memeriksa data...');
    const ex = await getRetry(key, true);
    let old = null;
    if(ex && ex.value){
      try{ old = JSON.parse(ex.value); }catch(e){}
      if(old && nameNorm(old.nama) !== nameNorm(s.nama)) throw new Error('Nomor absen ini sudah dipakai pengumpulan atas nama lain. Periksa kembali data identitas.');
      if(old && lkmGraded(old)) throw new Error('Tugas sudah dinilai guru, tidak dapat diganti.');
    }
    let b64 = '', ftype = '', fname = '';
    if(file){
      prog('Memproses berkas...');
      const f = /^image\//i.test(file.type) ? await lkmCompressImage(file) : await lkmReadFile(file);
      b64 = f.b64; ftype = f.type; fname = f.name;
    }
    const chunks = []; for(let i = 0; i < b64.length; i += LKM_CHUNK) chunks.push(b64.slice(i, i + LKM_CHUNK));
    const ver = Date.now().toString(36);
    let done = 0;
    await poolMap(chunks.map((c, n) => n), 3, async n => {
      await storageSet(`tugasf:${ik}:${sid}:${ver}:${n}`, chunks[n]);
      done++; prog(`Mengunggah berkas... ${done}/${chunks.length}`);
    });
    const meta = { itemId: ik, itemJudul: it.judul || '', nama: s.nama.trim(), kelas: lkmKelas(), noAbsen: s.noAbsen.trim(),
      fileName: fname, fileType: ftype, size: Math.round(b64.length * 0.75), link, catatan, chunks: chunks.length, ver,
      submittedAt: new Date().toISOString(), nilai: '', catatanGuru: '',
      nilaiSiswa: old ? old.nilaiSiswa : undefined, nilaiSiswaAt: old ? old.nilaiSiswaAt : undefined };
    prog('Menyimpan data pengumpulan...');
    await storageSet(key, JSON.stringify(meta));
    if(old && old.chunks) lkmDeleteChunks(ik, sid, old.ver, old.chunks);
    s.status[ik] = meta; s.openForm = null; s.busy = false;
    render();
    const m = document.getElementById('lkm-msg'); if(m){ m.className = 'recap-status'; m.textContent = '✅ Tugas berhasil dikirim ke guru.'; }
  }catch(e){
    console.error(e);
    s.busy = false; if(btn) btn.disabled = false;
    prog('⚠️ ' + ((e && e.message) || 'Gagal mengirim tugas. Periksa koneksi lalu coba lagi.'), true);
  }
}
async function lkmSaveSelfScore(it, raw, btn){
  const s = lkmState(), ik = itemKeyOf(it);
  const say = (m, err) => { const e = document.querySelector(`[data-lkm-ns-msg="${ik}"]`); if(e){ e.textContent = m; e.style.color = err ? 'var(--red)' : 'var(--teal-deep)'; } };
  const v = String(raw).trim(), n = Number(v);
  if(v === '' || isNaN(n) || n < 0 || n > 100){ say('Isi angka 0–100.', true); return; }
  if(!window.storage){ say('Penyimpanan bersama belum aktif.', true); return; }
  if(!lkmIdentOk()){ say('Lengkapi identitas di atas dahulu.', true); return; }
  btn.disabled = true; say('Menyimpan...');
  try{
    const sid = lkmStudentId(), key = `tugas:${ik}:${sid}`;
    const ex = await getRetry(key, true); let meta = null;
    if(ex && ex.value){ try{ meta = JSON.parse(ex.value); }catch(e){} }
    if(meta && nameNorm(meta.nama) !== nameNorm(s.nama)) throw new Error('Nomor absen ini sudah dipakai atas nama lain.');
    if(!meta) meta = { itemId: ik, itemJudul: it.judul || '', nama: s.nama.trim(), kelas: lkmKelas(), noAbsen: s.noAbsen.trim(),
      fileName: '', fileType: '', size: 0, link: '', catatan: '', chunks: 0, ver: '', submittedAt: '', nilai: '', catatanGuru: '' };
    meta.nilaiSiswa = n; meta.nilaiSiswaAt = new Date().toISOString();
    await storageSet(key, JSON.stringify(meta));
    s.status[ik] = meta; render(); say('✅ Nilai tersimpan.');
  }catch(e){ console.error(e); btn.disabled = false; say('⚠️ ' + ((e && e.message) || 'Gagal menyimpan. Coba lagi.'), true); }
}

function tugasCapture(){

        <td><input type="number" min="0" max="100" step="any" style="width:76px;padding:6px 8px;border:1px solid var(--line);border-radius:4px;font-family:'JetBrains Mono',monospace;" data-tn="${x.idx}" value="${escAttr(nv)}"></td>

        <td><button class="btn" style="padding:4px 10px;font-size:12px;color:var(--red);border-color:var(--red);" data-tdel="${x.idx}">Buka Kembali</button></td></tr>`;

  board.querySelectorAll('[data-tdel]').forEach(el => el.onclick = () => tugasReopen(t.rows[parseInt(el.dataset.tdel, 10)]));

async function tugasLoad(){
  const t = tugasState();
  if(!window.storage){ tugasStatus('Penyimpanan bersama belum aktif.', true); return; }
  t.loading = true; tugasStatus('Memuat pengumpulan...');
  const item = t.item;
  try{
    const lr = await window.storage.list(`tugas:${item}:`, true);
    const keys = (lr && lr.keys) ? lr.keys : [];
    const metas = await poolMap(keys, 10, async k => {
      const r = await getRetry(k, true);
      if(r && r.value){ try{ return Object.assign(JSON.parse(r.value), { _key: k }); }catch(e){} }
      return null;
    });
    if(t.item !== item){ t.loading = false; return; }
    t.rows = metas.filter(Boolean).sort((a, b) => kelasCmp(normKelas(a.kelas), normKelas(b.kelas)) || absenNum(a.noAbsen) - absenNum(b.noAbsen) || String(a.nama || '').localeCompare(String(b.nama || ''), 'id'));
    t.loading = false; renderTugasBoard(); tugasStatus(`${t.rows.length} pengumpulan dimuat.`);
  }catch(e){ console.error(e); t.loading = false; tugasStatus('Gagal memuat pengumpulan. Coba lagi.', true); }
}
async function tugasDownload(r, btn){
  if(!r) return;
  const sid = r._key.split(':')[2], ik = r._key.split(':')[1];
  const old = btn.innerHTML; btn.disabled = true; btn.textContent = 'Mengunduh...';
  try{
    const idx = []; for(let n = 0; n < r.chunks; n++) idx.push(n);
    const parts = await poolMap(idx, 4, async n => { const g = await getRetry(`tugasf:${ik}:${sid}:${r.ver}:${n}`, true); return g && g.value ? g.value : null; });
    if(parts.some(p => p === null)) throw new Error('Potongan berkas tidak lengkap');
    const bin = atob(parts.join('')), bytes = new Uint8Array(bin.length);
    for(let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const url = URL.createObjectURL(new Blob([bytes], { type: r.fileType || 'application/octet-stream' }));
    const a = document.createElement('a'); a.href = url;
    a.download = `${(r.nama || 'siswa').replace(/\s+/g, '_')}_${normKelas(r.kelas)}_${r.fileName || 'tugas'}`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 2000);
  }catch(e){ console.error(e); alert('Gagal mengunduh berkas. Coba lagi beberapa saat.'); }
  btn.disabled = false; btn.innerHTML = old;
}
async function tugasReopen(r){
  if(!r) return;
  if(!confirm(`Buka kembali tugas ${r.nama} (${normKelas(r.kelas)})?\n\nBerkas dan nilai lama dihapus, siswa boleh mengumpulkan ulang.`)) return;
  const t = tugasState(), sid = r._key.split(':')[2], ik = r._key.split(':')[1];
  tugasStatus('Membuka kembali...');
  try{
    await window.storage.delete(r._key, true);
    await lkmDeleteChunks(ik, sid, r.ver, r.chunks);
    t.rows = t.rows.filter(x => x !== r); renderTugasBoard(); tugasStatus(`Tugas ${r.nama} dibuka kembali.`);
  }catch(e){ console.error(e); tugasStatus('Gagal membuka kembali. Coba lagi.', true); }
}
async function tugasSaveGrades(){
  const t = tugasState(); tugasCapture();
  if(!t.rows || !t.rows.length){ tugasStatus('Belum ada data untuk disimpan.', true); return; }
  const changes = [];
  t.rows.forEach(r => {
    const nv = String(r._tn !== undefined ? r._tn : (r.nilai === undefined || r.nilai === null ? '' : r.nilai)).trim();
    const nc = String(r._tc !== undefined ? r._tc : (r.catatanGuru || '')).trim();
    if(nv !== String(r.nilai === undefined || r.nilai === null ? '' : r.nilai) || nc !== String(r.catatanGuru || '')) changes.push({ r, nv, nc });
  });
  if(!changes.length){ tugasStatus('Tidak ada perubahan nilai.'); return; }
  const bad = changes.find(c => c.nv !== '' && (isNaN(Number(c.nv)) || Number(c.nv) < 0 || Number(c.nv) > 100));
  if(bad){ tugasStatus(`Nilai "${bad.nv}" untuk ${bad.r.nama} tidak valid (harus 0–100).`, true); return; }
  tugasStatus('Menyimpan nilai...');
  let fail = 0;
  await poolMap(changes, 4, async c => {
    try{
      const g = await getRetry(c.r._key, true);
      const meta = g && g.value ? JSON.parse(g.value) : null;
      if(!meta) throw new Error('data tidak ditemukan');
      meta.nilai = c.nv === '' ? '' : Number(c.nv); meta.catatanGuru = c.nc; meta.gradedAt = new Date().toISOString();
      await storageSet(c.r._key, JSON.stringify(meta));
      Object.assign(c.r, meta); delete c.r._tn; delete c.r._tc;
    }catch(e){ console.error(e); fail++; }
  });
  renderTugasBoard();
  tugasStatus(fail ? `${changes.length - fail} nilai tersimpan, ${fail} gagal. Klik Simpan Semua Nilai lagi.` : `✅ ${changes.length} nilai tersimpan. Siswa dapat melihatnya di menu LKM.`, !!fail);
}
function tugasCsv(){
  const t = tugasState(); tugasCapture();
  if(!t.rows || !t.rows.length){ tugasStatus('Belum ada data untuk diunduh.', true); return; }
  const rows = t.rows.filter(r => t.kelas === 'ALL' || normKelas(r.kelas) === t.kelas);
  const judul = (lkmItemsAll().find(it => itemKeyOf(it) === t.item) || {}).judul || 'LKM';
  const header = ['No', 'Nama', 'Kelas', 'No Absen', 'Waktu Kumpul', 'Berkas', 'Link', 'Nilai Menurut Siswa', 'Nilai', 'Catatan Guru'];
  const lines = [csvEscape('LKM: ' + judul), header.join(',')];
  rows.forEach((r, i) => lines.push([i + 1, csvEscape(r.nama), csvEscape(normKelas(r.kelas)), csvEscape(r.noAbsen), csvEscape(fmtWaktu(r.submittedAt)), csvEscape(r.fileName || ''), csvEscape(r.link || ''), r.nilaiSiswa === undefined || r.nilaiSiswa === null ? '' : r.nilaiSiswa, r.nilai === undefined || r.nilai === null ? '' : r.nilai, csvEscape(r.catatanGuru || '')].join(',')));
  triggerDownload('﻿' + lines.join('\r\n'), `Nilai_LKM_${judul.replace(/[^A-Za-z0-9]+/g, '_')}_${new Date().toISOString().slice(0, 10)}.csv`);
}
function attachTugasHandlers(){
  const t = tugasState(), it = document.getElementById('tg-item'); if(!it) return;
  it.onchange = e => { tugasCapture(); t.item = e.target.value; t.rows = null; t.kelas = 'ALL'; renderTugasBoard(); tugasStatus(''); tugasLoad(); };
  document.getElementById('tg-kelas').onchange = e => { t.kelas = e.target.value; renderTugasBoard(); };
  document.getElementById('tg-load').onclick = () => { tugasCapture(); tugasLoad(); };
  document.getElementById('tg-save').onclick = tugasSaveGrades;
  document.getElementById('tg-csv').onclick = tugasCsv;
  renderTugasBoard(); tugasStatus(t.msg, t.err);
  if(t.rows === null && !t.loading) tugasLoad();
}

/* ======================================================================
   DAFTAR NILAI PER KELAS PARALEL
   ====================================================================== */
function normKelas(k){
  return String(k||'').trim().toUpperCase().replace(/\s*[-_.\/]\s*/g,'-').replace(/\s+/g,'-') || '(TANPA KELAS)';
}
function kelasCmp(a,b){ return a.localeCompare(b, 'id', {numeric:true}); }
function absenNum(v){ const n = parseInt(v,10); return isNaN(n) ? 9999 : n; }
function classRows(){
  let rows = (state.recap.rows || []).map(r => ({...r, _k: normKelas(r.kelas)}));
  if(state.recap.best){
    const best = new Map();
    rows.forEach(r => {
      const key = r._k + '|' + String(r.nama||'').trim().toLowerCase().replace(/\s+/g,' ');
      const cur = best.get(key);
      if(!cur || r.percentage > cur.percentage || (r.percentage === cur.percentage && new Date(r.submittedAt) > new Date(cur.submittedAt))) best.set(key, r);
    });
    rows = [...best.values()];
  }
  rows.sort((a,b) => kelasCmp(a._k,b._k) || absenNum(a.noAbsen)-absenNum(b.noAbsen) || String(a.nama||'').localeCompare(String(b.nama||''),'id'));
  return rows;
}
function classStats(list){
  if(!list.length) return {n:0, avg:0, max:0, min:0};
  const ps = list.map(r => Number(r.percentage)||0);
  return { n: list.length, avg: Math.round(ps.reduce((a,b)=>a+b,0)/ps.length*10)/10, max: Math.max(...ps), min: Math.min(...ps) };
}
function secScoreOf(r, id){
  const s = (r.perSection||[]).find(p => p.id === id); if(!s) return '-';
  if(s.type === 'essay') return (r.essayMax > 0 && r.grade) ? `${fmtPts(s.pts)}/${fmtPts(s.max)}${s.pending ? '*' : ''}` : 'menunggu';
  return `${s.correct}/${s.total}`;
}
function essayStatusOf(r){ return r.essayMax > 0 ? (r.essayPending ? 'Uraian belum selesai dinilai' : 'Uraian sudah dinilai') : ''; }


async function fetchPendingStarts(rows){
  const done = new Set(rows.map(r => identKeys(r).nameKey));
  (LAST_HASIL_KEYS || []).forEach(k => { const parts = k.split('_'); if(parts.length === 3) done.add('mulai:' + parts[2]); });
  let out = [];
  try{
    const listRes = await window.storage.list('mulai:n', true);
    const keys = ((listRes && listRes.keys) ? listRes.keys : []).filter(k => !done.has(k));
    const got = await poolMap(keys, 12, async k => {
      const ck = NS + k;
      let o = RECAP_CACHE.get(ck);
      if(!o){
        const r = await getRetry(k, true);
        if(r && r.value){ try{ o = JSON.parse(r.value); RECAP_CACHE.set(ck, o); }catch(e){} }
      }
      return (o && (o.ujian||'formatif') === state.examType) ? Object.assign({}, o, { _key: k }) : null;
    });
    saveRecapCache();
    out = got.filter(Boolean);
  }catch(e){ console.error(e); }
  return out.sort((a,b) => new Date(a.startedAt) - new Date(b.startedAt));
}
async function resetAttempt(student, hasilKey){
  const nm = student.nama || '(tanpa nama)';
  if(!confirm(`Buka kembali ujian untuk ${nm} (${student.kelas})?\n\nHasil lama siswa ini dihapus dan siswa boleh mengerjakan sekali lagi.`)) return;
  state.recap.loading = true; state.recap.error = null; setRecapUI();
  const { nameKey, absenKey } = identKeys(student);
  const keys = [nameKey, absenKey]; if(hasilKey) keys.push(hasilKey);
  const oks = await Promise.all(keys.map(k => window.storage.delete(k, true).then(() => true).catch(() => false)));
  keys.forEach(k => RECAP_CACHE.delete(NS + k)); saveRecapCache();
  if(hasilKey){ try{ await window.storage.delete('uraian:' + String(hasilKey).replace(/^hasil:/, ''), true); }catch(e){} }
  if(oks.every(Boolean)){
    // perbarui daftar secara lokal: instan, tanpa mengunduh ulang seluruh rekap
    if(state.recap.rows){
      state.recap.rows = state.recap.rows.filter(r => r._key !== hasilKey);
      state.recap.count = state.recap.rows.length;
    }
    state.recap.pending = (state.recap.pending || []).filter(p => p._key !== nameKey);
    state.recap.loading = false; setRecapUI();
  } else {
    state.recap.error = 'Sebagian data gagal dibuka kembali. Memuat ulang daftar...';
    state.recap.loading = false;

}
function pendingHtml(){

function wirePending(board){

    });

function renderGradePanel(){

  const q = gradeQueue(), pos = q.findIndex(x => x._key === key);

      ${bq && bq.key ? `<div class="gq-key"><strong>Pedoman:</strong> ${escapeHtml(bq.key)}</div>` : ''}
      <div class="gq-score"><label>Skor</label><input type="number" min="0" max="${x.m}" step="0.5" data-gs="${x.n}" data-gmax="${x.m}" value="${v === undefined || v === null ? '' : escapeHtml(v)}"> <span>dari ${fmtPts(x.m)}</span>
        <button class="btn" style="padding:4px 10px;font-size:12px;" data-gset="${x.n}|0">0</button><button class="btn" style="padding:4px 10px;font-size:12px;" data-gset="${x.n}|${x.m}">Penuh</button></div>
    </div>`; }).join('')}
    ${shorts.length ? `<details style="margin-top:8px;"><summary style="cursor:pointer;font-size:13px;">Tinjau jawaban isian siswa (${shorts.filter(x => x.ok).length}/${shorts.length} benar otomatis)</summary>
      <ol style="font-size:13px;padding-left:20px;">${shorts.map(x => `<li value="${x.n}">${escapeHtml(x.s)} &rarr; <strong>${x.a && x.a.trim() ? escapeHtml(x.a) : '(kosong)'}</strong> ${x.ok ? '&#9989;' : '&#10060;'}</li>`).join('')}</ol></details>` : ''}
    <label class="qe-lbl" style="margin-top:10px;">Catatan guru (opsional, tidak ditampilkan ke siswa)</label>
    <textarea class="qe-area" rows="2" id="grade-note">${escapeHtml((r.grade && r.grade.note) || '')}</textarea>
    <div class="recap-actions" style="margin-top:10px;">
      <button class="btn primary" id="btn-grade-save">&#128190; Simpan Nilai</button>

function wireGradePanel(board){
  board.querySelectorAll('[data-kgrade]').forEach(el => el.onclick = () => {
    state.recap.grading = el.dataset.kgrade; renderClassBoard();
    const gp = document.getElementById('grade-panel'); if(gp) gp.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  const first = board.querySelector('[data-kgrade-first]');
  if(first) first.onclick = () => {
    const r = gradeQueue().find(x => x.essayPending) || classRows().find(x => x.essayPending);
    if(!r) return; state.recap.grading = r._key; renderClassBoard();
    const gp = document.getElementById('grade-panel'); if(gp) gp.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };
  const gp = document.getElementById('grade-panel'); if(!gp) return;
  const say = (m, err) => { const e = document.getElementById('grade-status'); if(e){ e.className = 'recap-status' + (err ? ' error' : ''); e.textContent = m; } };
  gp.querySelectorAll('[data-gset]').forEach(el => el.onclick = () => {
    const [n, v] = el.dataset.gset.split('|'); const inp = gp.querySelector(`[data-gs="${n}"]`); if(inp) inp.value = v;
  });
  document.getElementById('btn-grade-close').onclick = () => { state.recap.grading = null; renderClassBoard(); };
  const save = async (goNext) => {
    const r = (state.recap.rows || []).find(x => x._key === gp.dataset.gkey); if(!r) return;
    const scores = {}; let bad = '';
    gp.querySelectorAll('[data-gs]').forEach(el => {
      const raw = el.value.trim(); if(raw === '') return;
      const n = parseFloat(raw.replace(',', '.')), mx = Number(el.dataset.gmax);
      if(!isFinite(n) || n < 0 || n > mx) bad = `Skor No. ${el.dataset.gs} harus antara 0 dan ${fmtPts(mx)}.`;
      else scores[el.dataset.gs] = n;
    });
    if(bad){ say(bad, true); return; }
    const note = document.getElementById('grade-note').value.trim();
    gp.querySelectorAll('button').forEach(b => b.disabled = true); say('Menyimpan...');
    try{ await saveEssayGrade(r, scores, note); }
    catch(e){ console.error(e); gp.querySelectorAll('button').forEach(b => b.disabled = false); say('Gagal menyimpan nilai. Periksa koneksi lalu coba lagi.', true); return; }
    if(goNext){
      const q = gradeQueue(), i = q.findIndex(x => x._key === r._key);
      const nxt = q.slice(i + 1).find(x => x.essayPending) || q.find(x => x.essayPending && x._key !== r._key);
      state.recap.grading = nxt ? nxt._key : null;
      renderClassBoard();
      if(nxt){ const g2 = document.getElementById('grade-panel'); if(g2) g2.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
      else { const e = document.getElementById('recap-status'); if(e){ e.className = 'recap-status'; e.textContent = '\u2705 Semua uraian pada daftar ini sudah dinilai.'; } }
    } else { renderClassBoard(); const e2 = document.getElementById('grade-status'); if(e2){ e2.className = 'recap-status'; e2.textContent = '\u2705 Nilai tersimpan.'; } }
  };
  document.getElementById('btn-grade-save').onclick = () => save(false);
  document.getElementById('btn-grade-next').onclick = () => save(true);
}

function downloadClassCSV(kelas){
  const rows = classRows();
  if(!rows.length){ state.recap.error = 'Belum ada data hasil ulangan yang tersimpan.'; setRecapUI(); return; }
  const sectionIds = DATA.sections.map(x => x.id);
  const header = ['No','Nama','Kelas','No Absen', ...sectionIds.map(id => `Skor Bagian ${id}`), 'Total Benar','Total Soal','Nilai (0-100)','Pindah Layar','Waktu Submit','Status Uraian'];
  const groups = {};
  rows.forEach(r => (groups[r._k] = groups[r._k] || []).push(r));
  const names = (kelas === 'ALL' ? Object.keys(groups) : [kelas]).filter(n => groups[n]).sort(kelasCmp);
  const lines = [header.join(',')];
  names.forEach((n, gi) => {
    if(gi > 0) lines.push('');
    groups[n].forEach((r,i) => {
      lines.push([i+1, csvEscape(r.nama), csvEscape(n), csvEscape(r.noAbsen), ...sectionIds.map(id => secScoreOf(r,id).replace('-','')), r.totalCorrect, r.totalQ, r.percentage, r.pelanggaran||0, csvEscape(new Date(r.submittedAt).toLocaleString('id-ID')), csvEscape(essayStatusOf(r))].join(','));
    });
    const st = classStats(groups[n]);
    const avgRow = new Array(header.length).fill('');
    avgRow[1] = csvEscape('Rata-rata Kelas ' + n); avgRow[header.length-4] = st.avg;
    lines.push(avgRow.join(','));
  });
  const tag = kelas === 'ALL' ? 'Semua_Kelas' : 'Kelas_' + kelas.replace(/[^A-Z0-9\-]/gi,'_');
  triggerDownload('\uFEFF' + lines.join('\r\n'), `Nilai_${state.examType}_${tag}_${new Date().toISOString().slice(0,10)}.csv`);
}

/* ======================================================================
   KUMPULAN NILAI (Panel Guru)
   Menggabungkan nilai siswa: LKM, Latihan, Ulangan Formatif, UTS, Ulangan Sumatif,
   Remidi, dan Pengayaan dalam satu tabel per kelas.
   Sumber data:
     - Formatif / UTS / Sumatif / Remidi : entri 'hasil:' (rekap otomatis)
     - LKM                                 : 'tugas:<item>:<siswa>' (nilai resmi guru)
     - Latihan & Pengayaan                 : 'nilaiman:<item>:<kelas>' (input manual guru)
   Pengaturan (KKM, bobot, aturan remidi) disimpan di state.settings.nilaiCfg.
   ====================================================================== */
const REMIDI_OF = { uts:'remidi_uts', uts2:'remidi_uts2', sumatif:'remidi_sumatif', sumatif_genap:'remidi_sumatif_genap' };
for(let n = 1; n <= 10; n++) for(let k = 1; k <= IKTP_COUNT; k++) REMIDI_OF[iktpId('formatif' + (n === 1 ? '' : n), k)] = iktpId('remidi' + (n === 1 ? '' : n), k);
const REMIDI_BASE = {}; Object.keys(REMIDI_OF).forEach(k => { REMIDI_BASE[REMIDI_OF[k]] = k; });
function kkmUjianVal(){ const m = (state.settings && state.settings.kkmUjian) || {}, v = m[state.examType]; return (v === undefined || v === null) ? '' : v; }
function nilaiKkmOf(id, cfg){
  const m = (state.settings && state.settings.kkmUjian) || {};
  const ok = v => v !== undefined && v !== null && v !== '' && isFinite(Number(v));
  if(ok(m[id])) return Number(m[id]);
  if(REMIDI_BASE[id] && ok(m[REMIDI_BASE[id]])) return Number(m[REMIDI_BASE[id]]);
  return cfg.kkm;
}
const NILAI_DEF = { kkm:75, remidiGanti:true, capKkm:true,
  bobot:{ lkm:10, latihan:10, formatif:20, uts:20, sumatif:30, remidi:0, pengayaan:10 } };

function nilaiCfg(){
  const c = (state.settings && state.settings.nilaiCfg) || {}, k = Number(c.kkm);
  return {
    kkm: (c.kkm === undefined || c.kkm === '' || !isFinite(k)) ? NILAI_DEF.kkm : k,
    remidiGanti: c.remidiGanti === undefined ? NILAI_DEF.remidiGanti : !!c.remidiGanti,
    capKkm: c.capKkm === undefined ? NILAI_DEF.capKkm : !!c.capKkm,
    bobot: Object.assign({}, NILAI_DEF.bobot, c.bobot || {})
  };
}
function nilaiState(){
  if(!state.nilai) state.nilai = { loaded:false, loading:false, stu:{}, manual:{}, kelas:'ALL', sem:'ganjil', detail:false, msg:'', err:false, manItem:'', manKelas:'', _manRows:[] };
  return state.nilai;
}
function nilaiCats(){
  const ex = g => EXAM_TYPES.filter(t => t.group === g).map(t => ({ id:t.id, label:t.label, short:t.short }));
  const menu = id => (getMenuItems()[id] || []).filter(it => (it.judul || '').trim()).map(it => ({ id: id + ':' + itemKeyOf(it), label: it.judul }));
  return [
    { id:'lkm',       label:'LKM',              items: menu('lkm') },
    { id:'latihan',   label:'Latihan',          items: ex('latihan'), manual:true },
    { id:'formatif',  label:'Ulangan Formatif', items: ex('formatif') },
    { id:'uts',       label:'UTS',              items: ex('uts') },
    { id:'sumatif',   label:'Ulangan Sumatif',  items: ex('sumatif') },
    { id:'remidi',    label:'Remidi',           items: ex('remidi') },
    { id:'pengayaan', label:'Pengayaan',        items: menu('pengayaan'), manual:true },
  ];
}
/* Semester tiap penilaian. Bawaan: UTS 2, Sumatif Genap, dan remidinya = Genap; remidi mengikuti ujian aslinya;
   Formatif 6–10 dan Latihan 6–10 = Genap; selebihnya (LKM, Pengayaan, Formatif 1–5, Latihan 1–5) = Ganjil sampai guru mengaturnya di panel "Pembagian Semester". */
function nilaiSemOf(id){
  const m = (state.settings && state.settings.nilaiSem) || {}, ok = v => v === 'ganjil' || v === 'genap';
  if(ok(m[id])) return m[id];
  const base = REMIDI_BASE[id] || id;
  if(base !== id && ok(m[base])) return m[base];
  if(/^(formatif|latihan)(6|7|8|9|10)(_k\d)?$/.test(base)) return 'genap';
  return ({ uts2:'genap', sumatif_genap:'genap' })[base] || 'ganjil';
}
function nilaiSemLabel(sem){ return sem === 'genap' ? 'Genap' : 'Ganjil'; }
function nilaiActiveCats(cats){
  const N = nilaiState(), all = Object.values(N.stu);
  return cats.map(c => {
    const items = c.items.filter(it => nilaiSemOf(it.id) === N.sem);
    return Object.assign({}, c, { items, shown: items.filter(it => all.some(s => s.v[it.id])) });
  });
}
function nilaiSid(kelas, absen, nama){
  const a = String(absen || '').trim().toLowerCase().replace(/^0+(?=\d)/, '');
  return normKelas(kelas) + '|' + (a ? a : 'n:' + nameNorm(nama));
}
function nilaiTouch(box, nama, kelas, absen, ts){
  const sid = nilaiSid(kelas, absen, nama);
  let s = box.stu[sid];
  if(!s) s = box.stu[sid] = { sid, nama:'', kelas: normKelas(kelas), noAbsen: String(absen || '').trim(), v:{}, _t:0 };
  const t = ts ? (new Date(ts).getTime() || 0) : 0;
  if(nama && (!s.nama || t >= s._t)){ s.nama = String(nama).trim(); s._t = t; }
  return s;
}
function nilaiPut(s, id, val, pend){
  const n = Number(val); if(val === '' || val === null || val === undefined || !isFinite(n)) return;
  const cur = s.v[id];
  if(!cur || n > cur.val) s.v[id] = { val:n, pend:!!pend };   // beberapa hasil: pakai yang tertinggi
}
function nilaiFmt(n){ return (n === null || n === undefined || !isFinite(n)) ? '' : String(Math.round(n * 10) / 10).replace('.', ','); }
function nilaiAvg(a){ return a.length ? a.reduce((x, y) => x + y, 0) / a.length : null; }
function nilaiShort(l){ l = String(l); return l.length > 22 ? l.slice(0, 21) + '\u2026' : l; }

function nilaiCompute(s, cats, cfg){
  const items = {}, catv = {}, flags = {}, kk = {}, catk = {};
  let below = 0, tot = 0;
  cats.forEach(c => {
    const vals = [], ks = [];
    c.items.forEach(it => {
      const x = s.v[it.id], k = nilaiKkmOf(it.id, cfg);
      kk[it.id] = k;
      items[it.id] = x ? x.val : null;
      let e = x ? x.val : null, up = false;
      if(cfg.remidiGanti && REMIDI_OF[it.id]){
        const r = s.v[REMIDI_OF[it.id]];
        if(r){ const rv = cfg.capKkm ? Math.min(r.val, nilaiKkmOf(REMIDI_OF[it.id], cfg)) : r.val; if(e === null || rv > e){ e = rv; up = true; } }
      }
      if(e !== null){
        vals.push(e); ks.push(k); if(up) flags[c.id] = true;
        if(REMIDI_OF[it.id]){ tot++; if(e < k) below++; }
      }
      if(x && x.pend) flags[c.id + '_p'] = true;
    });
    catv[c.id] = nilaiAvg(vals); catk[c.id] = ks.length ? nilaiAvg(ks) : cfg.kkm;
  });
  let sw = 0, sv = 0;
  cats.forEach(c => { const w = Number(cfg.bobot[c.id]) || 0; if(catv[c.id] !== null && w > 0){ sw += w; sv += w * catv[c.id]; } });
  return { items, catv, flags, kk, catk, below, tot, final: sw ? sv / sw : null };
}
function nilaiRows(){
  const N = nilaiState();
  return Object.values(N.stu).filter(s => N.kelas === 'ALL' || s.kelas === N.kelas)
    .sort((a, b) => kelasCmp(a.kelas, b.kelas) || absenNum(a.noAbsen) - absenNum(b.noAbsen) || String(a.nama).localeCompare(String(b.nama), 'id'));
}

/* ---- Muat semua nilai ---- */
function nilaiMsg(m, err){
  const N = nilaiState(); N.msg = m; N.err = !!err;
  const e = document.getElementById('nl-status'); if(e){ e.className = 'recap-status' + (err ? ' error' : ''); e.textContent = m; }
}
function nilaiManMsg(m, err){
  const e = document.getElementById('nm-status'); if(e){ e.className = 'recap-status' + (err ? ' error' : ''); e.textContent = m; }
}
function nilaiBusy(b){ document.querySelectorAll('#nl-actions button').forEach(x => x.disabled = !!b); }
async function nilaiLoad(){
  const N = nilaiState();
  if(N.loading) return;
  if(!window.storage){ nilaiMsg('Penyimpanan bersama belum aktif.', true); return; }
  N.loading = true; nilaiBusy(true); nilaiMsg('Memuat nilai ujian...');
  const tmp = { stu:{}, manual:{} };
  try{
    // 1) Hasil ujian (formatif, UTS, sumatif, remidi)
    const lr = await window.storage.list('hasil:', true);
    const keys = (lr && lr.keys) ? lr.keys : [];
    let done = 0;
    const parsed = await poolMap(keys, 12, async k => {
      const ck = NS + k; let o = RECAP_CACHE.get(ck);
      if(!o){ const r = await getRetry(k, true); if(r && r.value){ try{ o = JSON.parse(r.value); RECAP_CACHE.set(ck, o); }catch(e){} } }
      done++; if(done % 10 === 0 || done === keys.length) nilaiMsg(`Memuat hasil ujian... ${done}/${keys.length}`);
      return o ? Object.assign({}, o, { _key:k }) : null;
    });
    saveRecapCache();
    const rows = parsed.filter(Boolean);
    await loadEssayGrades(rows);
    const valid = new Set(EXAM_TYPES.filter(t => !t.practice).map(t => t.id));
    rows.forEach(r => {
      const u = r.ujian || 'formatif'; if(!valid.has(u)) return;
      nilaiPut(nilaiTouch(tmp, r.nama, r.kelas, r.noAbsen, r.submittedAt), u, r.percentage, r.essayPending);
    });
    // 2) Nilai LKM (nilai resmi dari guru)
    nilaiMsg('Memuat nilai LKM...');
    for(const it of (getMenuItems().lkm || []).filter(x => (x.judul || '').trim())){
      const ik = itemKeyOf(it);
      const l2 = await window.storage.list(`tugas:${ik}:`, true);
      const ks = (l2 && l2.keys) ? l2.keys : [];
      const metas = await poolMap(ks, 10, async k => { const r = await getRetry(k, true); if(r && r.value){ try{ return JSON.parse(r.value); }catch(e){} } return null; });
      metas.filter(Boolean).forEach(m => {
        const s = nilaiTouch(tmp, m.nama, m.kelas, m.noAbsen, m.submittedAt);
        if(lkmGraded(m)) nilaiPut(s, 'lkm:' + ik, m.nilai, false);
      });
    }
    // 3) Nilai manual (Latihan & Pengayaan)
    nilaiMsg('Memuat nilai manual...');
    const ml = await window.storage.list('nilaiman:', true);
    const mk = (ml && ml.keys) ? ml.keys : [];
    const mans = await poolMap(mk, 8, async k => { const r = await getRetry(k, true); if(r && r.value){ try{ return JSON.parse(r.value); }catch(e){} } return null; });
    mans.filter(Boolean).forEach(m => {
      tmp.manual[m.item + '|' + m.kelas] = m;
      Object.keys(m.rows || {}).forEach(k => {
        const r = m.rows[k], s = nilaiTouch(tmp, r.n, m.kelas, r.a);
        if(r.v !== '' && r.v !== null && r.v !== undefined) nilaiPut(s, m.item, r.v, false);
      });
    });
    // siswa yang ditambahkan manual tetapi belum tersimpan tidak dibuang
    Object.values(N.stu).forEach(s => { if(s.added && !tmp.stu[s.sid]) tmp.stu[s.sid] = s; });
    N.stu = tmp.stu; N.manual = tmp.manual; N.loaded = true;
    N.loading = false; nilaiBusy(false);
    renderNilaiBoard(); renderNilaiManualBoard();
    nilaiMsg(`\u2705 ${Object.keys(N.stu).length} siswa dimuat (${new Date().toLocaleTimeString('id-ID')}).`);
  }catch(e){
    console.error(e);
    N.loading = false; nilaiBusy(false); renderNilaiBoard();
    nilaiMsg('Gagal memuat nilai. Periksa koneksi lalu klik Muat / Segarkan Data lagi.', true);
  }
}

function renderNilaiBoard(){
  const board = document.getElementById('nl-board'), sel = document.getElementById('nl-kelas');
  if(!board || !sel) return;

  if(!N.loaded){
    sel.innerHTML = '<option value="ALL">Semua kelas</option>';

    return;
  }
  const all = Object.values(N.stu);
  const names = [...new Set(all.map(s => s.kelas))].sort(kelasCmp);
  if(N.kelas !== 'ALL' && names.indexOf(N.kelas) < 0) N.kelas = 'ALL';
  sel.innerHTML = `<option value="ALL">Semua kelas (${all.length} siswa)</option>` +

  if(!list.length){ board.innerHTML = '<div class="recap-status">Belum ada nilai yang tersimpan.</div>'; return; }
  const cfg = nilaiCfg(), cats = nilaiActiveCats(nilaiCats());
  const cols = [];
  cats.forEach(c => { if(N.detail) c.shown.forEach(it => cols.push({ k:'item', c, it })); cols.push({ k:'cat', c }); });
  const calc = new Map(list.map(s => [s, nilaiCompute(s, cats, cfg)]));
  const low = (v, k) => (v !== null && v !== undefined && v < (k === undefined ? cfg.kkm : k)) ? ' nl-low' : '';
  const tuntas = cp => cp.tot === 0 ? '-' : (cp.below === 0 ? 'Tuntas' : 'Belum tuntas (' + cp.below + ')');
  const dash = '<span style="color:var(--ink-soft);">-</span>';
  const cellOf = (col, cp, s) => {
    if(col.k === 'item'){
      const v = cp.items[col.it.id], x = s.v[col.it.id];
      return `<td class="num${low(v, cp.kk[col.it.id])}">${v === null ? dash : nilaiFmt(v) + (x && x.pend ? ' &#9203;' : '')}</td>`;
    }

    return `<td class="num${low(v, cp.catk[col.c.id])}">${v === null ? dash : '<strong>' + nilaiFmt(v) + '</strong>' +
      (cp.flags[col.c.id] ? ' <span title="Sudah memakai nilai remidi">&uarr;</span>' : '') +
      (cp.flags[col.c.id + '_p'] ? ' <span title="Ada nilai sementara (uraian belum selesai dinilai)">&#9203;</span>' : '')}</td>`;
  };
  const rs = N.detail ? 2 : 1;

                   : cats.map(c => `<th class="num">${escapeHtml(c.label)}</th>`).join('');
  head += `<th class="num" rowspan="${rs}" title="Rata-rata berbobot sesuai pengaturan di bawah">Nilai Akhir</th><th rowspan="${rs}" title="Tuntas bila semua Formatif, UTS, dan Sumatif (setelah remidi) mencapai KKM masing-masing">Ketuntasan</th></tr>`;
  if(N.detail) head += '<tr>' + cols.map(col => col.k === 'item' ? `<th class="num" title="${escAttr(col.it.label)}">${escapeHtml(col.it.short || nilaiShort(col.it.label))}</th>` : '<th class="num">Rata-rata</th>').join('') + '</tr>';
  const groups = {};
  list.forEach(s => (groups[s.kelas] = groups[s.kelas] || []).push(s));
  let body = '';
  Object.keys(groups).sort(kelasCmp).forEach(n => {
    if(N.kelas === 'ALL') body += `<tr class="grp"><td colspan="${cols.length + 5}">Kelas ${escapeHtml(n)}</td></tr>`;
    groups[n].forEach((s, i) => {

        cols.map(col => cellOf(col, cp, s)).join('') +
        `<td class="num fin${low(cp.final)}">${cp.final === null ? dash : nilaiFmt(cp.final)}</td><td class="${cp.below > 0 ? 'nl-low' : ''}" style="${cp.below > 0 ? 'color:var(--red);font-weight:600;' : ''}">${tuntas(cp)}</td></tr>`;
    });
    const avgOf = fn => { const a = groups[n].map(s => fn(calc.get(s))).filter(v => v !== null); return a.length ? nilaiFmt(nilaiAvg(a)) : '-'; };
    body += `<tr class="avg"><td></td><td>Rata-rata kelas ${escapeHtml(n)}</td><td></td>` +
      cols.map(col => `<td class="num">${avgOf(cp => col.k === 'item' ? cp.items[col.it.id] : cp.catv[col.c.id])}</td>`).join('') +
      `<td class="num">${avgOf(cp => cp.final)}</td><td></td></tr>`;

  const filled = cats.map(c => `${escapeHtml(c.label)}: ${list.filter(s => calc.get(s).catv[c.id] !== null).length}`).join(' &middot; ');
  board.innerHTML = `<div style="font-family:'Fraunces',serif;font-weight:600;font-size:15px;margin:12px 0 0;">Semester ${nilaiSemLabel(N.sem)}</div><div class="kls-wrap"><table class="kls-table"><thead>${head}</thead><tbody>${body}</tbody></table></div>
    <div class="kls-stats">${list.length} siswa &middot; KKM umum ${nilaiFmt(cfg.kkm)}; KKM tiap ulangan diatur di tab <em>Sesi &amp; Token</em> (nilai di bawah KKM berwarna merah)<br>Jumlah siswa yang punya nilai &mdash; ${filled}<br>&uarr; = sudah memakai nilai remidi &middot; &#9203; = nilai sementara karena soal uraian belum selesai dinilai</div>`;
}

async function nilaiManualSave(){
  const N = nilaiState(), item = N.manItem, kelas = N.manKelas, studs = N._manRows || [];
  if(!item || !kelas){ nilaiManMsg('Pilih penilaian dan kelas terlebih dahulu.', true); return; }
  if(!window.storage){ nilaiManMsg('Penyimpanan bersama belum aktif.', true); return; }
  const vals = {}; let bad = '';
  document.querySelectorAll('[data-nmv]').forEach(el => {
    const s = studs[parseInt(el.dataset.nmv, 10)]; if(!s) return;
    const raw = el.value.trim();
    if(raw === ''){ vals[s.sid] = ''; return; }
    const n = parseFloat(raw.replace(',', '.'));
    if(!isFinite(n) || n < 0 || n > 100) bad = `Nilai ${s.nama || 'absen ' + s.noAbsen} tidak valid (harus 0\u2013100).`;
    else vals[s.sid] = n;
  });
  if(bad){ nilaiManMsg(bad, true); return; }
  const mkey = item + '|' + kelas, key = `nilaiman:${item}:${kelas}`, old = N.manual[mkey];
  const rows = {};
  studs.forEach(s => {
    const v = vals[s.sid], had = old && old.rows && old.rows[s.sid];
    if((v !== undefined && v !== '') || s.added || had) rows[s.sid] = { n:s.nama, a:s.noAbsen, v: v === undefined ? '' : v };
  });
  nilaiBusyManual(true); nilaiManMsg('Menyimpan...');
  try{
    if(!Object.keys(rows).length){ try{ await window.storage.delete(key, true); }catch(e){} delete N.manual[mkey]; }
    else { const rec = { item, kelas, rows, at: new Date().toISOString() }; await storageSet(key, JSON.stringify(rec)); N.manual[mkey] = rec; }
    studs.forEach(s => {
      const v = vals[s.sid];
      if(v === undefined || v === '') delete s.v[item]; else s.v[item] = { val:v, pend:false };
      if(s._dr) delete s._dr[item];
      s.added = false;
    });
    renderNilaiBoard(); renderNilaiManualBoard();
    nilaiManMsg('\u2705 Nilai tersimpan.');
  }catch(e){ console.error(e); nilaiManMsg('Gagal menyimpan nilai. Periksa koneksi lalu coba lagi.', true); }
  nilaiBusyManual(false);
}
function nilaiBusyManual(b){ const x = document.getElementById('nm-save'); if(x) x.disabled = !!b; }
function nilaiManualAdd(){
  const N = nilaiState();
  const ab = document.getElementById('nm-add-absen').value.trim(), nm = document.getElementById('nm-add-nama').value.trim();
  if(!N.manKelas){ nilaiManMsg('Pilih kelas terlebih dahulu.', true); return; }
  if(!ab || !nm){ nilaiManMsg('Isi nomor absen dan nama siswa.', true); return; }
  const sid = nilaiSid(N.manKelas, ab, nm);
  if(N.stu[sid]){ nilaiManMsg(`Nomor absen ${ab} di kelas ${N.manKelas} sudah ada atas nama ${N.stu[sid].nama || '(tanpa nama)'}.`, true); return; }
  nilaiManualCapture();
  nilaiTouch(N, nm, N.manKelas, ab).added = true;
  document.getElementById('nm-add-absen').value = ''; document.getElementById('nm-add-nama').value = '';
  renderNilaiManualBoard(); renderNilaiBoard();
  nilaiManMsg(`${nm} ditambahkan. Isi nilainya lalu klik Simpan Nilai.`);
}

/* ---- Pengaturan perhitungan ---- */
async function nilaiSaveCfg(){
  const st = document.getElementById('nl-cfg-status');
  const say = (m, err) => { if(st){ st.className = 'recap-status' + (err ? ' error' : ''); st.textContent = m; } };
  const kkm = Number(document.getElementById('nl-kkm').value);
  if(!isFinite(kkm) || kkm < 0 || kkm > 100){ say('KKM harus berupa angka 0\u2013100.', true); return; }
  const bobot = {}; let bad = '';
  document.querySelectorAll('[data-nlw]').forEach(el => {
    const raw = el.value.trim(), v = raw === '' ? 0 : Number(raw);
    if(!isFinite(v) || v < 0 || v > 100) bad = 'Bobot harus berupa angka 0\u2013100.'; else bobot[el.dataset.nlw] = v;
  });
  if(bad){ say(bad, true); return; }
  if(!Object.values(bobot).some(v => v > 0)){ say('Setidaknya satu bobot harus lebih dari 0.', true); return; }
  state.settings.nilaiCfg = { kkm, remidiGanti: document.getElementById('nl-remganti').checked, capKkm: document.getElementById('nl-cap').checked, bobot };
  say('Menyimpan...');
  await saveSettings();
  renderNilaiBoard();
  say('\u2705 Pengaturan tersimpan dan langsung diterapkan pada tabel.');
}

/* ---- Unduh CSV ---- */
function nilaiCsv(){
  const N = nilaiState();
  if(!N.loaded || !Object.keys(N.stu).length){ nilaiMsg('Muat data nilai terlebih dahulu.', true); return; }
  const cfg = nilaiCfg(), cats = nilaiActiveCats(nilaiCats()), list = nilaiRows();
  const cols = [];
  cats.forEach(c => { c.shown.forEach(it => cols.push({ k:'item', c, it })); cols.push({ k:'cat', c }); });
  const header = ['No', 'Nama', 'Kelas', 'No Absen', ...cols.map(col => col.k === 'item' ? col.it.label : 'Rata-rata ' + col.c.label), 'Nilai Akhir', 'Ketuntasan'].map(csvEscape);
  const num = v => (v === null || v === undefined) ? '' : Math.round(v * 10) / 10;
  const groups = {};
  list.forEach(s => (groups[s.kelas] = groups[s.kelas] || []).push(s));
  const lines = [header.join(',')];
  Object.keys(groups).sort(kelasCmp).forEach((n, gi) => {
    if(gi > 0) lines.push('');
    const cps = groups[n].map(s => nilaiCompute(s, cats, cfg));
    groups[n].forEach((s, i) => {
      const cp = cps[i];
      lines.push([i + 1, csvEscape(s.nama), csvEscape(n), csvEscape(s.noAbsen), ...cols.map(col => num(col.k === 'item' ? cp.items[col.it.id] : cp.catv[col.c.id])), num(cp.final), csvEscape(cp.tot === 0 ? '' : (cp.below === 0 ? 'Tuntas' : 'Belum tuntas (' + cp.below + ')'))].join(','));
    });
    const avg = fn => { const a = cps.map(fn).filter(v => v !== null); return a.length ? num(nilaiAvg(a)) : ''; };
    lines.push(['', csvEscape('Rata-rata Kelas ' + n), '', '', ...cols.map(col => avg(cp => col.k === 'item' ? cp.items[col.it.id] : cp.catv[col.c.id])), avg(cp => cp.final), ''].join(','));
  });
  const tag = N.kelas === 'ALL' ? 'Semua_Kelas' : 'Kelas_' + N.kelas.replace(/[^A-Z0-9\-]/gi, '_');
  triggerDownload('\uFEFF' + lines.join('\r\n'), `Kumpulan_Nilai_Semester_${nilaiSemLabel(N.sem)}_${tag}_${new Date().toISOString().slice(0, 10)}.csv`);
  nilaiMsg('\u2705 File CSV Semester ' + nilaiSemLabel(N.sem) + ' diunduh.');
}


/* ---- Unduh Excel (.xlsx) rapi ---- */
let _exceljsPromise = null;
function loadExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  if(_exceljsPromise) return _exceljsPromise;
  _exceljsPromise = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js';
    sc.onload = () => res();
    sc.onerror = () => { _exceljsPromise = null; rej(new Error('Pustaka Excel gagal dimuat. Periksa koneksi internet.')); };
    document.head.appendChild(sc);
  });
  return _exceljsPromise;
}
async function nilaiXlsx(){
  const N = nilaiState();
  if(!N.loaded || !Object.keys(N.stu).length){ nilaiMsg('Muat data nilai terlebih dahulu.', true); return; }
  nilaiBusy(true); nilaiMsg('Menyiapkan file Excel...');
  try{
    await loadExcelJS();
    const cfg = nilaiCfg(), cats = nilaiActiveCats(nilaiCats()), list = nilaiRows();
    const semLbl = nilaiSemLabel(N.sem), meta = (typeof DATA !== 'undefined' && DATA.meta) || {};
    const C = { head:'FF265747', head2:'FF3C6E5C', white:'FFFFFFFF', zebra:'FFF3F8F5', catBg:'FFE6F1EB', line:'FFB7C4BE', avg:'FFDCEBE3', title:'FF1F3D33',
                lowBg:'FFFDE3E1', lowTx:'FF9B1C1C', okBg:'FFE1F3E7', okTx:'FF1B6B3A' };
    const thin = { style:'thin', color:{ argb:C.line } }, box = { top:thin, left:thin, bottom:thin, right:thin };
    const fill = argb => ({ type:'pattern', pattern:'solid', fgColor:{ argb } });
    const round1 = v => (v === null || v === undefined || !isFinite(v)) ? null : Math.round(v * 10) / 10;
    const stamp = 'Diunduh ' + new Date().toLocaleString('id-ID');
    const sub = extra => [meta.school, meta.subject, 'Semester ' + semLbl, extra, stamp].filter(Boolean).join('  \u2022  ');

    const wb = new ExcelJS.Workbook();
    wb.creator = meta.school || 'Aplikasi Ujian'; wb.created = new Date();
    const used = new Set();
    const sheetName = nm => {
      let base = String(nm || 'Sheet').replace(/[\[\]:*?\/\\]/g, '-').trim().slice(0, 31) || 'Sheet', out = base, i = 2;
      while(used.has(out.toLowerCase())){ const suf = ' (' + (i++) + ')'; out = base.slice(0, 31 - suf.length) + suf; }
      used.add(out.toLowerCase()); return out;
    };
    const mkSheet = (name, freezeX, freezeY) => wb.addWorksheet(sheetName(name), {
      views:[{ state:'frozen', xSplit:freezeX, ySplit:freezeY, showGridLines:false }],
      pageSetup:{ orientation:'landscape', paperSize:9, fitToPage:true, fitToWidth:1, fitToHeight:0, margins:{ left:.4, right:.4, top:.5, bottom:.6, header:.3, footer:.3 } }
    });
    const putTitle = (ws, ncol, title, subtitle) => {
      ws.mergeCells(1, 1, 1, ncol); ws.mergeCells(2, 1, 2, ncol);
      const t = ws.getCell(1, 1); t.value = title; t.font = { name:'Calibri', size:15, bold:true, color:{ argb:C.title } }; t.alignment = { vertical:'middle' };
      const u = ws.getCell(2, 1); u.value = subtitle; u.font = { name:'Calibri', size:10, italic:true, color:{ argb:'FF5F6B66' } }; u.alignment = { vertical:'middle' };
      ws.getRow(1).height = 26;
    };
    const hdr = (cell, val, bg) => {
      cell.value = val; cell.font = { name:'Calibri', size:11, bold:true, color:{ argb:C.white } };
      cell.fill = fill(bg || C.head); cell.alignment = { vertical:'middle', horizontal:'center', wrapText:true }; cell.border = box;
    };

    const cols = [];
    cats.forEach(c => { c.shown.forEach(it => cols.push({ k:'item', c, it })); cols.push({ k:'cat', c }); });
    const FIRST = 4, NAMEC = 2, ABS = 3;               // kolom nilai pertama = 4
    const colFinal = FIRST + cols.length, colKet = colFinal + 1, ncol = colKet;
    const HR1 = 4, HR2 = 5, D0 = 6;
    const groups = {}; list.forEach(s => (groups[s.kelas] = groups[s.kelas] || []).push(s));
    const names = Object.keys(groups).sort(kelasCmp);
    const ketText = cp => cp.tot === 0 ? '' : (cp.below === 0 ? 'Tuntas' : 'Belum tuntas (' + cp.below + ')');
    const summary = [];

    const wsSum = names.length > 1 ? mkSheet('Ringkasan', 0, 4) : null;   // dibuat dulu agar menjadi sheet pertama
    /* ---- satu sheet per kelas ---- */
    const classSheets = names.map(n => {
      const ws = mkSheet(n, 3, HR2);
      ws.headerFooter.oddFooter = '&LKelas ' + n + '&RHalaman &P dari &N';
      ws.getColumn(1).width = 6; ws.getColumn(2).width = 30; ws.getColumn(3).width = 9;
      cols.forEach((col, i) => { ws.getColumn(FIRST + i).width = col.k === 'item' ? 15 : 14; });
      ws.getColumn(colFinal).width = 13; ws.getColumn(colKet).width = 20;
      const sts = groups[n], cps = sts.map(s => nilaiCompute(s, cats, cfg));
      putTitle(ws, ncol, `Kumpulan Nilai Siswa \u2013 Kelas ${n}`, sub(`${sts.length} siswa`));

      // header 2 baris
      ['No', 'Nama', 'Absen'].forEach((t, i) => { hdr(ws.getCell(HR1, i + 1), t); hdr(ws.getCell(HR2, i + 1), null); ws.mergeCells(HR1, i + 1, HR2, i + 1); });
      hdr(ws.getCell(HR1, colFinal), 'Nilai Akhir'); hdr(ws.getCell(HR2, colFinal), null); ws.mergeCells(HR1, colFinal, HR2, colFinal);
      hdr(ws.getCell(HR1, colKet), 'Ketuntasan'); hdr(ws.getCell(HR2, colKet), null); ws.mergeCells(HR1, colKet, HR2, colKet);
      let ci = FIRST;
      cats.forEach(c => {
        const span = c.shown.length + 1, start = ci;
        for(let k = 0; k < span; k++) hdr(ws.getCell(HR1, start + k), k === 0 ? c.label : null);
        if(span > 1) ws.mergeCells(HR1, start, HR1, start + span - 1);
        c.shown.forEach(it => { hdr(ws.getCell(HR2, ci++), it.label, C.head2); });
        hdr(ws.getCell(HR2, ci++), 'Rata-rata', C.head2);
      });
      ws.getRow(HR1).height = 24; ws.getRow(HR2).height = 44;

      // data
      sts.forEach((s, i) => {
        const cp = cps[i], row = ws.getRow(D0 + i); row.height = 20;
        const base = (cell, horiz) => { cell.font = { name:'Calibri', size:11 }; cell.border = box; cell.alignment = { vertical:'middle', horizontal:horiz || 'center' }; if(i % 2) cell.fill = fill(C.zebra); };
        row.getCell(1).value = i + 1; base(row.getCell(1));
        row.getCell(NAMEC).value = s.nama || '(tanpa nama)'; base(row.getCell(NAMEC), 'left');
        const ab = Number(s.noAbsen); row.getCell(ABS).value = (s.noAbsen !== '' && isFinite(ab)) ? ab : (s.noAbsen || ''); base(row.getCell(ABS));
        cols.forEach((col, k) => {
          const cell = row.getCell(FIRST + k); base(cell);
          const v = round1(col.k === 'item' ? cp.items[col.it.id] : cp.catv[col.c.id]);
          const kkm = col.k === 'item' ? cp.kk[col.it.id] : cp.catk[col.c.id];
          cell.value = v; cell.numFmt = '0.0';
          if(col.k === 'cat'){ cell.font = { name:'Calibri', size:11, bold:true }; if(i % 2 === 0) cell.fill = fill(C.catBg); }
          if(v !== null && v < kkm){ cell.fill = fill(C.lowBg); cell.font = { name:'Calibri', size:11, bold:true, color:{ argb:C.lowTx } }; }
          const notes = [];
          if(col.k === 'item'){ const x = s.v[col.it.id]; if(x && x.pend) notes.push('Nilai sementara: soal uraian belum selesai dinilai.'); }
          else { if(cp.flags[col.c.id]) notes.push('Sudah memakai nilai remidi.'); if(cp.flags[col.c.id + '_p']) notes.push('Ada nilai sementara (uraian belum selesai dinilai).'); }
          if(notes.length) cell.note = notes.join('\n');
        });
        const fc = row.getCell(colFinal), fv = round1(cp.final); base(fc); fc.value = fv; fc.numFmt = '0.0'; fc.font = { name:'Calibri', size:11, bold:true };
        if(fv !== null && fv < cfg.kkm){ fc.fill = fill(C.lowBg); fc.font = { name:'Calibri', size:11, bold:true, color:{ argb:C.lowTx } }; }
        const kc = row.getCell(colKet); base(kc); kc.value = ketText(cp);
        if(cp.tot > 0){ kc.font = { name:'Calibri', size:11, bold:true, color:{ argb: cp.below === 0 ? C.okTx : C.lowTx } }; kc.fill = fill(cp.below === 0 ? C.okBg : C.lowBg); }
      });
      const last = D0 + sts.length - 1;
      ws.autoFilter = { from:{ row:HR2, column:1 }, to:{ row:last, column:ncol } };

      // baris rata-rata (rumus Excel, mengabaikan sel kosong)
      const ar = last + 1, arow = ws.getRow(ar); arow.height = 22;
      for(let c = 1; c <= ncol; c++){
        const cell = arow.getCell(c);
        cell.fill = fill(C.avg); cell.font = { name:'Calibri', size:11, bold:true }; cell.alignment = { vertical:'middle', horizontal:'center' };
        cell.border = { top:{ style:'medium', color:{ argb:C.head } }, left:thin, bottom:thin, right:thin };
      }
      ws.mergeCells(ar, 1, ar, 3);
      const lab = arow.getCell(1); lab.value = 'Rata-rata Kelas ' + n; lab.alignment = { vertical:'middle', horizontal:'right' };
      const avgFn = fn => { const a = cps.map(fn).filter(v => v !== null && v !== undefined); return a.length ? nilaiAvg(a) : null; };
      const putAvg = (c, fn) => {
        const r = avgFn(fn); if(r === null) return;
        const L = ws.getColumn(c).letter;
        arow.getCell(c).value = { formula:`ROUND(AVERAGE(${L}${D0}:${L}${last}),1)`, result: round1(r) }; arow.getCell(c).numFmt = '0.0';
      };
      cols.forEach((col, k) => putAvg(FIRST + k, cp => col.k === 'item' ? cp.items[col.it.id] : cp.catv[col.c.id]));
      putAvg(colFinal, cp => cp.final);
      const tn = cps.filter(cp => cp.tot > 0 && cp.below === 0).length, bt = cps.filter(cp => cp.tot > 0 && cp.below > 0).length;
      arow.getCell(colKet).value = `${tn} tuntas / ${bt} belum`;

      const lg = ws.getRow(ar + 2).getCell(1);
      ws.mergeCells(ar + 2, 1, ar + 2, ncol);
      lg.value = `Keterangan: sel merah = di bawah KKM (KKM umum ${nilaiFmt(cfg.kkm)}; KKM tiap ulangan sesuai pengaturan). Sel yang punya tanda segitiga merah di pojok berisi catatan (memakai nilai remidi / nilai sementara).`;
      lg.font = { name:'Calibri', size:9, italic:true, color:{ argb:'FF5F6B66' } }; lg.alignment = { wrapText:true, vertical:'top' }; ws.getRow(ar + 2).height = 28;
      ws.pageSetup.printTitlesRow = HR1 + ':' + HR2;
      const fin = cps.map(cp => cp.final).filter(v => v !== null);
      summary.push([n, sts.length, fin.length ? round1(nilaiAvg(fin)) : null, fin.length ? round1(Math.max(...fin)) : null, fin.length ? round1(Math.min(...fin)) : null, tn, bt]);
      return ws;
    });

    /* ---- sheet Ringkasan (di depan, bila lebih dari satu kelas) ---- */
    if(wsSum){
      const ws = wsSum;
      const heads = ['No', 'Kelas', 'Jumlah Siswa', 'Rata-rata Nilai Akhir', 'Tertinggi', 'Terendah', 'Tuntas', 'Belum Tuntas'];
      [6, 14, 15, 20, 12, 12, 12, 15].forEach((w, i) => { ws.getColumn(i + 1).width = w; });
      putTitle(ws, heads.length, `Ringkasan Nilai per Kelas \u2013 Semester ${semLbl}`, sub(`${list.length} siswa`));
      heads.forEach((t, i) => hdr(ws.getCell(4, i + 1), t)); ws.getRow(4).height = 32;
      summary.forEach((r, i) => {
        const row = ws.getRow(5 + i); row.height = 20;
        [i + 1, ...r].forEach((v, c) => {
          const cell = row.getCell(c + 1); cell.value = v; cell.border = box; cell.font = { name:'Calibri', size:11 };
          cell.alignment = { vertical:'middle', horizontal:'center' }; if(i % 2) cell.fill = fill(C.zebra);
          if(c >= 3 && c <= 5 && typeof v === 'number'){ cell.numFmt = '0.0'; if(v < cfg.kkm){ cell.fill = fill(C.lowBg); cell.font = { name:'Calibri', size:11, bold:true, color:{ argb:C.lowTx } }; } }
        });
      });
    }

    /* ---- sheet Pengaturan (dokumentasi cara hitung) ---- */
    {
      const ws = mkSheet('Pengaturan', 0, 0);
      ws.getColumn(1).width = 34; ws.getColumn(2).width = 18;
      putTitle(ws, 2, 'Pengaturan Perhitungan Nilai', sub(''));
      const rows = [['KKM umum', cfg.kkm], ['Remidi menggantikan nilai asli', cfg.remidiGanti ? 'Ya' : 'Tidak'], ['Nilai remidi dibatasi KKM', cfg.capKkm ? 'Ya' : 'Tidak'], ['Semester', semLbl]];
      cats.forEach(c => rows.push(['Bobot ' + c.label + ' (%)', Number(cfg.bobot[c.id]) || 0]));
      hdr(ws.getCell(4, 1), 'Komponen'); hdr(ws.getCell(4, 2), 'Nilai');
      rows.forEach((r, i) => r.forEach((v, c) => {
        const cell = ws.getCell(5 + i, c + 1); cell.value = v; cell.border = box; cell.font = { name:'Calibri', size:11 };
        cell.alignment = { vertical:'middle', horizontal: c ? 'center' : 'left' }; if(i % 2) cell.fill = fill(C.zebra);
      }));
    }

    const buf = await wb.xlsx.writeBuffer();
    const blob = new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const tag = N.kelas === 'ALL' ? 'Semua_Kelas' : 'Kelas_' + N.kelas.replace(/[^A-Z0-9\-]/gi, '_');
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = `Kumpulan_Nilai_Semester_${semLbl}_${tag}_${new Date().toISOString().slice(0, 10)}.xlsx`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    nilaiBusy(false); nilaiMsg('\u2705 File Excel Semester ' + semLbl + ' diunduh.');
  }catch(e){ console.error(e); nilaiBusy(false); nilaiMsg('Gagal membuat file Excel: ' + (e.message || e), true); }
}
